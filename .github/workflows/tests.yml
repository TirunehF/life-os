name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Server and repository checks (Python standard library)
        run: python3 -m unittest discover -s tests -v
      - name: Demo data
        run: node --test tests/demo.test.mjs
      - name: Browser smoke test (headless Chrome, both modes)
        run: node tests/smoke.mjs
        env:
          CHROME_NO_SANDBOX: "1"
