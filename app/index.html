/* focus mode: category and tag popovers */
function popHTML(cat){const f=S.focus;const on=t=>(f&&f.tag===t?' on':'');const item=(tag,color,icon,label)=>'<button class="pt'+on(tag)+'" style="--c:'+color+'" data-fx-cat="'+cat+'" data-fx-tag="'+tag+'" data-fx-color="'+color+'">'+ms(icon,'xs')+h(label)+'</button>';if(cat==='habits'){const ms_=monthStart(S.cursor),me=monthEnd(S.cursor);const hs=Object.values(S.data.habits).filter(x=>range(ms_,me).some(d=>habitActiveOn(x,d))).sort((a,b)=>(a.order||0)-(b.order||0));if(!hs.length)return '';return '<div class="pop">'+hs.map(x=>item('h:'+x.id,x.color,iconOf(x.icon),x.name)).join('')+'</div>';}if(cat==='sport'){const list=sports();if(!list.length)return '';return '<div class="pop">'+sportTypes().map(tp=>{const of=list.filter(s=>s.type===tp.name);if(!of.length)return '';return item('st:'+tp.name,tp.color,iconOf(tp.icon,'directions_run'),tp.name)+of.map(s=>'<div style="padding-left:14px">'+item('s:'+s.name,tp.color,sportIcon(s.name),s.name)+'</div>').join('');}).join('')+list.filter(s=>!typeOf(s.type)).map(s=>item('s:'+s.name,'#8A8F99',sportIcon(s.name),s.name)).join('')+'</div>';}if(cat==='tasks'){return '<div class="pop">'+areas().map(a=>item('a:'+a.name,a.color,iconOf(a.icon,'flag'),a.name)).join('')+'</div>';}if(cat==='people'){const ms_=monthStart(S.cursor),me=monthEnd(S.cursor);const ppl=peopleIn(ms_,me);if(!ppl.length)return '';return '<div class="pop"><div class="ph">Seen in '+MONTHS[fromISO(S.cursor).getMonth()]+'</div>'+ppl.map(x=>item('p:'+x.name.toLowerCase(),'var(--accent)','person',x.name+' · '+x.n)).join('')+'</div>';}if(cat==='rating'){return '<div class="pop">'+[5,4,3,2,1].map(n=>'<button class="pt'+on('r:'+n)+'" style="--c:var(--r'+n+')" data-fx-cat="rating" data-fx-tag="r:'+n+'" data-fx-color="var(--r'+n+')"><span class="ms xs fill" style="color:var(--r'+n+')">star</span>Rated '+n+'</button>').join('')+'<button class="pt'+on('core')+'" style="--c:var(--gold)" data-fx-cat="rating" data-fx-tag="core" data-fx-color="var(--gold)">'+ms('auto_awesome','xs fill')+'Core memory</button></div>';}return '';}
function focusName(f){const t=f.tag||'';return t.startsWith('h:')?((S.data.habits[t.slice(2)]||{}).name||''):t.startsWith('s:')?t.slice(2):t.startsWith('st:')?t.slice(3):t.startsWith('a:')?t.slice(2):t.startsWith('p:')?t.slice(2):t.startsWith('r:')?'rated '+t.slice(2):t==='core'?'core memory':'';}
function isExclusive(){return !!(S.focus&&!S.focus.tag&&Object.keys(S.layers).every(k=>S.layers[k]===(k===S.focus.cat)));}
function calHeadHTML(){const other=S.calMode==='month'?'week':'month';const title='<h1 class="cal-title" role="button" tabindex="0" data-action="cal-mode" data-m="'+other+'" title="Show the '+other+'" aria-label="'+(S.calMode==='month'?'Month':'Week')+' view, show the '+other+'">'+calTitleHTML()+'</h1>';const L=S.layers;const f=S.focus;const chip=(k,label)=>'<span class="chipw"><button class="chip'+(L[k]?' on':'')+(f&&f.cat===k?' fx':'')+'" data-action="layer" data-k="'+k+'" data-fx-cat="'+k+'" title="Click: show or hide · Double-click: only this"><i></i>'+label+(f&&f.cat===k&&f.tag?' · '+h(focusName(f)):'')+'</button>'+(k==='people'?popHTML(k).replace('class="pop"','class="pop pop-people"'):popHTML(k))+'</span>';const fxLabel='';return '<div class="head calhead"><div class="cal-nav" style="display:flex;align-items:center;gap:6px;overscroll-behavior-x:contain" title="Scroll sideways to move"><button class="ib" data-action="cal-prev" aria-label="Previous">‹</button>'+title+'<button class="ib" data-action="cal-next" aria-label="Next">›</button><button class="tb sm" data-action="cal-today"'+(calOnToday()?' hidden':'')+'>Today</button></div><div class="tools"><div class="chips">'+chip('rating','Rating')+chip('focus','Focus')+chip('habits','Habits')+chip('sport','Sport')+chip('people','People')+chip('tasks','Plan')+fxLabel+'</div></div></div>';}
function gridClass(){const L=S.layers;return 'grid '+(S.calMode==='month'?'month':'week')+Object.keys(L).map(k=>(L[k]?' l-':' no-')+k).join('');}
function cellData(iso,habs){habs=habsFor(iso);const d=getDay(iso);const acts=allActs(iso);const ppl=dayPeople(iso);const tk=dayTasks(iso);const has=[];const tags=[];if(d.rating){has.push('rating');tags.push('r:'+d.rating);}if(d.core){has.push('rating');tags.push('core');}if(d.focus)has.push('focus');const doneH=habs.filter(hb=>habitDone(iso,hb.id));if(doneH.length){has.push('habits');doneH.forEach(hb=>tags.push('h:'+hb.id));}if(acts.length){has.push('sport');acts.forEach(a=>{if(a.sport){tags.push('s:'+a.sport);const sp=sportByName(a.sport);if(sp&&sp.type)tags.push('st:'+sp.type);}});}if(ppl.length){has.push('people');ppl.forEach(p=>splitPeople(p.people).forEach(n=>tags.push('p:'+n.toLowerCase())));}const pl=planDay(iso).filter(x=>x.kind!=='routine');const extra=tk.doneHere.filter(z=>!pl.some(x=>x.ref===z.id));if(pl.length||extra.length){has.push('tasks');pl.forEach(x=>{if(x.task&&x.task.area)tags.push('a:'+x.task.area);});extra.forEach(z=>{if(z.area)tags.push('a:'+z.area);});}return {d:d,acts:acts,ppl:ppl,tk:tk,pl:pl,extra:extra,has:[...new Set(has)],tags:[...new Set(tags)]};}
function monthGridHTML(){let habs=null;const t=todayISO();const center=monthStart(S.cursor);const months=(isPhone()?[0]:[-2,-1,0,1,2]).map(n=>addMonths(center,n));return '<div class="calscroll" id="calscroll">'+months.map(m=>{const ms_=monthStart(m),me=monthEnd(m);const dates=range(weekStart(ms_),addDays(weekStart(me),6));const d=fromISO(m);return '<section class="mblock" data-month="'+m.slice(0,7)+'"><div class="'+gridClass()+'">'+DAYS.map(x=>'<div class="dow">'+x+'</div>').join('')+dates.map(iso=>cellHTML(iso,iso<ms_||iso>me,habs,t)).join('')+'</div></section>';}).join('')+'</div>';}

function cellHTML(iso,out,habs,t){const c=cellData(iso,habs);habs=habsFor(iso);const d=c.d;const L=S.layers;const planned=c.pl;const done=planned.filter(x=>x.st==='done').length+c.extra.length;const cls='cell'+(out?' out':'')+(iso===t?' today':'')+(iso===S.selected?' sel':'')+(L.rating&&d.rating?' rated':'')+(L.rating&&d.core?' core':'');let inner='<div class="c-top">'+dayNumHTML(iso,d,L)+'<span class="c-sport">'+c.acts.map(a=>{const sp=sportByName(a.sport);return '<span class="ms" style="--c:'+sportColor(a.sport)+'" data-s="'+h(a.sport)+'" data-st="'+h(sp&&sp.type||'')+'" title="'+h(a.sport)+'" aria-hidden="true">'+sportIcon(a.sport)+'</span>';}).join('')+c.pl.filter(x=>x.kind==='sport'&&x.st==='planned').map(x=>'<span class="ms pl" style="--c:'+x.color+'" title="'+h(x.title)+' · planned" aria-hidden="true">'+x.icon+'</span>').join('')+'</span></div>';inner+='<div class="c-focus">'+h(d.focus||'')+'</div>';inner+='<div class="c-hab">'+habs.map(hb=>habIcon(iso,hb)).join('')+'</div>';inner+='<div class="c-ppl">'+(c.ppl.length?ms('groups','xs')+'<span>'+h(c.ppl.map(p=>p.people).filter(Boolean).join(', '))+'</span>':'')+'</div>';inner+='<div class="c-task'+(planned.length&&done>=planned.length?' all':'')+'">'+(planned.length||done?ms('check_circle','xs')+'<span>'+(planned.length?done+'/'+planned.length:done)+'</span>':'')+'</div>';return '<button class="'+cls+'"'+(L.rating&&d.rating?' style="--tint:var(--r'+d.rating+')"':'')+' data-action="pick" data-date="'+iso+'" data-drop="day:'+iso+'" data-has="'+c.has.join(' ')+'" data-tags="'+h(c.tags.join(' '))+'">'+inner+'</button>';}
function weekGridHTML(){let habs=null;const t=todayISO();const center=weekStart(S.cursor);const weeks=(isPhone()?[0]:[-2,-1,0,1,2]).map(n=>addDays(center,7*n));return '<div class="weekscroll" id="weekscroll">'+weeks.map(ws=>{const dates=range(ws,addDays(ws,6));const w=isoWeek(ws);return '<section class="wblock" data-week="'+ws+'"><div class="'+gridClass()+'">'+dates.map(iso=>{const c=cellData(iso,habs);const d=c.d;const L=S.layers;let inner='<div class="whd"><div class="wd"><span>'+DAYS[dow(iso)]+' '+fromISO(iso).getDate()+'</span><small>'+(L.rating&&(d.rating||d.core)?ringHTML(d):'')+'</small></div>';inner+='<div class="focus">'+h(d.focus||'')+'</div>';habs=habsFor(iso);if(habs.length)inner+='<div class="hab-mini">'+habs.map(hb=>habIcon(iso,hb)).join('')+'</div>';const lk=L.tasks?planIdx().linked:new Set();const acts=c.acts.filter(a=>!lk.has(a.id)),ppl=c.ppl.filter(p=>!lk.has(p.id));if(acts.length)inner+='<div class="sp">'+acts.map(a=>{const sp=sportByName(a.sport);return '<span style="--c:'+sportColor(a.sport)+'" data-s="'+h(a.sport)+'" data-st="'+h(sp&&sp.type||'')+'">'+ms(sportIcon(a.sport),'xs')+h(a.sport||'Sport')+(a.note?' <span style="color:var(--ink-2)">· '+h(a.note)+'</span>':'')+'</span>';}).join('')+'</div>';if(ppl.length)inner+=ppl.map(p=>'<div class="ppl">'+ms('groups','xs')+h(p.people)+(p.activity?' · '+h(p.activity):'')+'</div>').join('');inner+='</div>'+weekPlanHTML(iso);if(d.highlight)inner+='<div class="quote">'+h(d.highlight)+'</div>';return '<div class="wcard'+(iso===t?' today':'')+(iso===S.selected?' sel':'')+(L.rating&&d.rating?' rated':'')+(L.rating&&d.core?' core':'')+'"'+(L.rating&&d.rating?' style="--tint:var(--r'+d.rating+')"':'')+' role="button" tabindex="0" data-action="pick" data-date="'+iso+'" data-drop="day:'+iso+'" data-has="'+c.has.join(' ')+'" data-tags="'+h(c.tags.join(' '))+'">'+inner+'</div>';}).join('')+'</div>'+(S.layers.tasks?weekTrayHTML(ws):'')+'</section>';}).join('')+'</div>';}
function applyFocus(){const grids=document.querySelectorAll('.grid');if(!grids.length)return;const f=S.hover||S.focus;grids.forEach(grid=>{grid.classList.remove('fx','fx-rating','fx-focus','fx-habits','fx-sport','fx-people','fx-tasks','tagged');const cells=grid.querySelectorAll('[data-has]');if(!f){cells.forEach(c=>c.classList.remove('hit'));grid.querySelectorAll('.fh').forEach(i=>i.classList.remove('fh'));grid.style.removeProperty('--fxc');return;}grid.classList.add('fx','fx-'+f.cat);if(f.color)grid.style.setProperty('--fxc',f.color);else grid.style.removeProperty('--fxc');cells.forEach(c=>{const has=(c.dataset.has||'').split(' ');const tags=(c.dataset.tags||'').split(' ');c.classList.toggle('hit',f.tag?tags.indexOf(f.tag)>=0:has.indexOf(f.cat)>=0);});const tag=f.tag||'';const hid=tag.startsWith('h:')?tag.slice(2):null;const sn=tag.startsWith('s:')?tag.slice(2):null;const stn=tag.startsWith('st:')?tag.slice(3):null;grid.classList.toggle('tagged',!!(hid||sn||stn));grid.querySelectorAll('[data-h]').forEach(i=>i.classList.toggle('fh',!!hid&&i.dataset.h===hid));grid.querySelectorAll('[data-s]').forEach(i=>i.classList.toggle('fh',(!!sn&&i.dataset.s===sn)||(!!stn&&i.dataset.st===stn)));});}

  const planB=planBlockHTML(iso),quiet=fut&&!acts.length&&!ppl.length&&!dayHasContent(Object.assign({},d,{focus:''}));

/* ---------- phone ----------
   On a phone the day is a page of its own. The date is the only thing at the top: pressed it goes back to
   today, held it opens Settings, swiped it moves to the next or the previous day. Under it sits the compass,
   one quiet line with the focus of the day; opened, it shows what the week and the month are about and how
   the week stands. What is planned is a list of rows that tick; a row swiped right is done, swiped left it
   moves to tomorrow. The sections are a bar at the bottom, with quick add in the middle. */
const viewNow=()=>S.view==='today'&&!isPhone()?'calendar':S.view;
const stays=()=>isPhone()||!canHover();
/* the day the page shows; a day sheet opened from this page moves the selection only while it is open */
const pageDay=()=>{const b=[S.sheet].concat(S.sheetStack).find(x=>x&&x.back);return b?b.back:S.selected;};
let tickT=0;
function tickOn(id){S.tick=id;if(S.touch)buzz();clearTimeout(tickT);tickT=setTimeout(()=>{S.tick=null;},600);}
function planRow(v,iso){const st=v.st,day=v.date||iso,a=v.link&&S.data.activities[v.link],note=a&&a.note?a.note:'';
  return '<span class="pchip rw '+st+(v.kind==='routine'?' rout':'')+(S.tick===v.id?' tkd':'')+'" style="--c:'+v.color+'"'+(st==='planned'&&!S.readOnly?' data-sw="plan:'+v.id+'" data-day="'+day+'"':'')+'><button class="pst" data-action="plan-toggle" data-id="'+v.id+'" data-ctx="'+day+'" aria-label="'+(st==='done'?'Mark not done':st==='skipped'?'Put back in the plan':'Mark done')+'" aria-pressed="'+(st==='done')+'"'+ro()+'>'+ms(st==='done'?'check_circle':st==='skipped'?'block':'radio_button_unchecked',st==='done'?'fill':'')+'</button>'+(v.kind==='task'?'':ms(v.icon,'pki'))+'<span class="ptt" role="button" tabindex="0" data-action="plan-menu" data-id="'+v.id+'" aria-expanded="'+(S.planOpen===v.id)+'">'+h(v.title)+'</span>'+(v.time?'<small>'+h(v.time)+'</small>':note?'<small>'+h(note)+'</small>':'')+(!planIn(v)&&v.kind!=='routine'?'<i class="pun"></i>':'')+'</span>';}
function todoRow(x,ctx,tail,sw){const dn=tdone(x);return '<span class="pchip rw '+(dn?'done':'planned')+(S.tick===x.id?' tkd':'')+'"'+(sw&&!dn&&!S.readOnly?' data-sw="task:'+x.id+'"':'')+'><button class="pst" data-action="task-done" data-id="'+x.id+'" data-ctx="'+ctx+'" aria-label="'+(dn?'Mark not done':'Mark done')+'" aria-pressed="'+dn+'"'+ro()+'>'+ms(dn?'check_circle':'radio_button_unchecked',dn?'fill':'')+'</button><span class="ptt" role="button" tabindex="0" data-action="task-open" data-id="'+x.id+'">'+h(x.title)+'</span>'+(tail||'')+'</span>';}
/* to-dos that are due, on today's page: what is overdue first, then what comes tomorrow */
function dueHTML(t){const all=Object.values(S.data.tasks).filter(x=>!tdone(x)&&x.plannedFor),tm=addDays(t,1);
  const late=all.filter(x=>x.plannedFor<t).sort((a,b)=>a.plannedFor.localeCompare(b.plannedFor)||taskSort(a,b)),next=all.filter(x=>x.plannedFor===tm).sort(taskSort),list=late.concat(next);
  if(!list.length)return '';const show=S.dueAll?list:list.slice(0,4);
  return '<div class="pband due"><div class="pl" title="To-dos due">'+ms('checklist')+'</div><span class="pmeta'+(late.length?' late':'')+'">'+(late.length?late.length+' overdue':next.length+' tomorrow')+'</span><div class="pc">'+show.map(x=>todoRow(x,t,tagBtn(x,'day',true).replace('>Overdue · ','>'),true)).join('')+(list.length>show.length?'<button class="pmore" data-action="due-all">'+(list.length-show.length)+' more</button>':'')+'</div></div>';}

const rvIntList=(p,per)=>p.kind==='week'?intents(per):weeksIn(p).reduce((a,w)=>a.concat(intents(getPeriod(w))),[]);

function rvCards(p,st,pv,per){const t=todayISO();
  const card=(key,v,sub,viz,dl)=>'<button class="rvc'+(S.rvPin===key?' pin':'')+'" data-rvm="'+key+'" data-action="rv-pin" aria-pressed="'+(S.rvPin===key)+'"><span class="k">'+ms(RVM[key][1],'xs')+RVM[key][0]+(dl||'')+'</span><span class="v">'+v+(sub?'<small>'+sub+'</small>':'')+'</span>'+viz+ms('push_pin','pinmark fill')+'</button>';
  const strip=fn=>'<span class="viz strip">'+st.days.map(x=>{const c=fn(x);return '<i'+(c?' style="background:'+c+'"':'')+'></i>';}).join('')+'</span>';
  const seg=parts=>'<span class="viz bar">'+(parts.some(q=>q[0])?parts.filter(q=>q[0]).map(q=>'<i style="--f:'+q[0]+(q[1]?';background:'+q[1]:'')+'"></i>').join(''):'<i></i>')+'</span>';
  const rbars='<span class="viz">'+st.days.map(x=>x.d.rating?'<i style="height:'+(x.d.rating*20)+'%;background:var(--r'+x.d.rating+')"></i>':'<i style="height:8%"></i>').join('')+'</span>';
  const hbars='<span class="viz">'+st.days.map(x=>{const hs=x.iso>t?[]:habitsOn(x.iso);if(!hs.length)return '<i style="height:8%"></i>';const f=hs.filter(hb=>habitDone(x.iso,hb.id)).length/hs.length;return '<i style="height:'+Math.max(8,Math.round(f*100))+'%'+(f?';background:var(--accent)':'')+'"></i>';}).join('')+'</span>';
  const il=rvIntList(p,per),tl=tally(il);
  return card('rating',st.avg?st.avg.toFixed(1):'–','',rbars,rvDelta(st.avg,pv.avg,1))
    +card('habits',st.habPct==null?'–':st.habPct+'%','',hbars,rvDelta(st.habPct,pv.habPct,0))
    +card('sport',st.acts.length,st.acts.length===1?'session':'sessions',strip(x=>x.acts.length?sportColor(x.acts[0].sport):''),rvDelta(st.acts.length,pv.acts.length,0))
    +card('people',st.peopleDays,st.peopleDays===1?'day':'days',strip(x=>x.ppl.length?'var(--accent)':''),rvDelta(st.peopleDays,pv.peopleDays,0))
    +card('tasks',st.plan.follow==null?'–':st.plan.follow+'%',st.plan.rows.length?st.plan.done.length+' of '+st.plan.rows.length:'',seg([[st.plan.held.length,'var(--accent)'],[st.plan.done.length-st.plan.held.length,'var(--r2)'],[st.plan.skipped.length+st.plan.out.length,'var(--r1)'],[st.plan.open.length+st.plan.ahead.length,'']]),rvDelta(st.plan.follow,pv.plan.follow,0))
    +card('journal',st.journaled,'of '+st.dates.length,strip(x=>dayHasContent(x.d)?(x.d.core?'var(--gold)':'var(--ink-2)'):''),'')
    +card('intent',tl.total?tl.done+'/'+tl.total:'–','',seg([[tl.done,INT.done.c],[tl.partly,INT.partly.c],[tl.dropped,INT.dropped.c],[tl.open,'']]),'');}

function rvDetail(key){const c=S.rvCtx;if(!c)return '';const p=c.p,st=c.st,pv=c.pv,per=c.per,t=todayISO(),wk=p.kind==='week',vs='vs last '+p.kind;let o='';
  const chip=d=>'<span class="rchip"'+(d.rating?' style="--c:var(--r'+d.rating+')"':'')+'>'+(d.rating||'')+'</span>';
  const dayRow=(x,body)=>'<button class="dk-row" data-action="rv-day" data-date="'+x.iso+'"><span class="d">'+dShort(x.iso)+'</span>'+chip(x.d)+'<span class="x">'+body+'</span></button>';
  const row2=(left,body,attrs,style)=>'<button class="dk-row nr"'+(attrs||'')+'><span class="d"'+(style?' style="'+style+'"':'')+'>'+left+'</span><span class="x">'+body+'</span></button>';
  const bar=(label,pct,val,color)=>'<div class="hr" style="--c:'+color+'"><span class="n">'+label+'</span><span class="bar"><i style="--w:'+Math.round(pct)+'%"></i></span><span class="v">'+val+'</span></div>';
  const facts=list=>'<div class="dk-facts">'+list.filter(Boolean).map(x=>'<span>'+x+'</span>').join('')+'</div>';
  if(key==='rating'){
    o='<div class="dk-big">'+(st.avg?st.avg.toFixed(1):'–')+'<small>'+st.rated.length+' of '+st.dates.length+' days rated</small>'+rvDelta(st.avg,pv.avg,1,'',vs)+'</div>';
    o+='<div class="bars tall">'+st.days.map(x=>x.d.rating?'<div style="height:'+(x.d.rating*20)+'%;--c:var(--r'+x.d.rating+')" title="'+fmtMid(x.iso)+': '+x.d.rating+'" data-action="rv-day" data-date="'+x.iso+'"></div>':'<div class="none" title="'+fmtMid(x.iso)+'" data-action="rv-day" data-date="'+x.iso+'"></div>').join('')+'</div>'+(wk?'<div class="barlbl" style="gap:3px">'+DAYS.map(x=>'<span>'+x[0]+'</span>').join('')+'</div>':'<div class="barlbl"><span style="text-align:left">'+fmtShort(p.start)+'</span><span style="text-align:right">'+fmtShort(p.end)+'</span></div>');
    if(!st.rated.length)return o+'<p class="empty" style="margin-top:12px">No day is rated in this '+p.kind+' yet.</p>';
    const cnt=[5,4,3,2,1].map(n=>st.rated.filter(x=>x.d.rating===n).length),mx=Math.max.apply(null,cnt)||1;
    const tot=st.rated.length,rs=st.rated.map(x=>x.d.rating).sort((a,b)=>a-b),med=tot%2?rs[(tot-1)/2]:(rs[tot/2-1]+rs[tot/2])/2,good=cnt[0]+cnt[1],low=cnt[3]+cnt[4];
    o+='<h3>Spread</h3><div class="hist">'+[1,2,3,4,5].map(n=>{const c=cnt[5-n];return '<div class="hc'+(c?'':' zero')+'" style="--c:var(--r'+n+');--h:'+Math.round(100*c/mx)+'" title="'+plural(c,'day')+' rated '+n+'"><span class="hn">'+(c||'')+'</span><i></i><b>'+n+'</b></div>';}).join('')+'<span class="avgm'+(st.avg>3.4?' r':'')+'" style="left:'+((st.avg-0.5)/5*100).toFixed(1)+'%" data-l="avg '+st.avg.toFixed(1)+'"></span></div>'+facts(['<b>'+Math.round(100*good/tot)+'%</b> rated 4 or 5','<b>'+Math.round(100*low/tot)+'%</b> rated 1 or 2','median <b>'+med+'</b>']);
    const line=(x,low)=>(x.d.focus?'<b>'+h(x.d.focus)+'</b> ':'')+h(String((low?x.d.lowlight||x.d.highlight:x.d.highlight||x.d.lowlight)||x.d.recap||'').slice(0,160));
    const srt=st.rated.slice().sort((a,b)=>b.d.rating-a.d.rating||a.iso.localeCompare(b.iso));const hi=srt[0].d.rating,lo=srt[srt.length-1].d.rating;
    o+='<h3>Best days</h3>'+srt.filter(x=>x.d.rating===hi).slice(0,4).map(x=>dayRow(x,line(x))).join('');
    if(lo<hi)o+='<h3>Lowest days</h3>'+srt.filter(x=>x.d.rating===lo).slice(0,4).map(x=>dayRow(x,line(x,true))).join('');
    if(!wk){
      o+='<h3>By week</h3>'+weeksIn(p).map(w=>{const a=avgR(st.days.filter(x=>x.iso>=w.start&&x.iso<=w.end));return bar(w.label,a?a*20:0,a?a.toFixed(1):'–',a?'var(--r'+Math.round(a)+')':'var(--line-2)');}).join('');
      o+='<h3>By weekday</h3>'+DAYS.map((dn,i)=>{const a=avgR(st.days.filter(x=>dow(x.iso)===i));return bar(dn,a?a*20:0,a?a.toFixed(1):'–',a?'var(--r'+Math.round(a)+')':'var(--line-2)');}).join('');
      const ctx=[['Sport days','other days',x=>x.acts.length],['With people','without',x=>x.ppl.length],['Focus set','no focus',x=>!!x.d.focus]];
      const rows=ctx.map(q=>{const A=st.rated.filter(q[2]),B=st.rated.filter(x=>!q[2](x));if(A.length<3||B.length<3)return '';const a=avgR(A),b=avgR(B);return '<div class="pair"><span class="pb"><span>'+q[0]+' <span style="color:var(--muted)">vs '+q[1]+'</span></span><i style="--w:'+a*20+'%"></i><i style="--w:'+b*20+'%"></i></span><span class="nv">'+a.toFixed(1)+'</span><span class="nv">'+b.toFixed(1)+'</span></div>';}).join('');
      o+='<h3>Rating by kind of day</h3>'+(rows||'')+'<p class="hint" style="margin:6px 0 0;font-size:12px">'+(rows?'Only shown once':'Shows once')+' both sides have three rated days.</p>';
    }
    return o;}
  if(key==='habits'){
    o='<div class="dk-big">'+(st.habPct==null?'–':st.habPct+'%')+'<small>of habit days done</small>'+rvWas(st.habPct,pv.habPct,'last '+p.kind)+'</div>';
    if(!st.habits.length)return o+'<p class="empty">No habit was active in this '+p.kind+'.</p>';
    const cw=wk?'20px':'5px';
    const rows=st.habits.map(x=>{let run=0,best=0;const cells=st.dates.map(iso=>{const act=habitActiveOn(x.hb,iso),fut=iso>t,on=act&&habitDone(iso,x.hb.id);if(on){run++;if(run>best)best=run;}else if(!fut)run=0;return '<i class="'+(on?'on':!act?'off':fut?'fut':'')+'" title="'+fmtMid(iso)+(on?' · done':'')+'"></i>';}).join('');x.best=best;return '<div style="display:contents;--c:'+x.hb.color+'"><span class="hn">'+ms(iconOf(x.hb.icon),'xs')+h(x.hb.name)+'</span>'+cells+'<span class="hv">'+x.n+'/'+x.den+'</span></div>';}).join('');
    o+='<div class="hgridw"><div class="hgrid'+(wk?'':' mo')+'" style="grid-template-columns:minmax('+(wk?96:58)+'px,1fr) repeat('+st.dates.length+','+cw+') auto"><span></span>'+st.dates.map(iso=>'<span class="hh">'+(wk?DAYS[dow(iso)][0]:(dow(iso)===0?fromISO(iso).getDate():''))+'</span>').join('')+'<span></span>'+rows+'</div></div>';
    o+='<h3>At a glance</h3>'+facts(['<b>'+st.allHab+'</b> '+(st.allHab===1?'day':'days')+' with every habit done'].concat(st.habits.filter(x=>x.best>1).sort((a,b)=>b.best-a.best).map(x=>h(x.hb.name)+' run of <b>'+x.best+'</b>')));
    const ch=st.habits.map(x=>{const q=pv.habits.find(y=>y.hb.id===x.hb.id);return q&&q.den?{x:x,d:x.pct-q.pct}:null;}).filter(Boolean);
    if(ch.length)o+='<h3>Against last '+p.kind+'</h3>'+ch.map(q=>'<div class="hr cmp" style="--c:'+q.x.hb.color+'"><span class="n">'+ms(iconOf(q.x.hb.icon),'s')+h(q.x.hb.name)+'</span><span class="bar"><i style="--w:'+q.x.pct+'%"></i></span><span class="v" style="width:auto">'+rvWas(q.x.pct,q.x.pct-q.d,'')+'</span></div>').join('');
    return o;}
  if(key==='sport'){
    o='<div class="dk-big">'+st.acts.length+'<small>'+(st.acts.length===1?'session':'sessions')+'</small>'+rvDelta(st.acts.length,pv.acts.length,0,'',vs)+'</div>';
    if(!st.acts.length)return o+'<p class="empty">No session logged in this '+p.kind+'.</p>';
    o+=facts(['<b>'+st.activeDays+'</b> active '+(st.activeDays===1?'day':'days'),'longest gap <b>'+st.sportGap+'</b> '+(st.sportGap===1?'day':'days')]);
    o+='<h3>By type</h3>'+Object.keys(st.byType).sort((a,b)=>st.byType[b]-st.byType[a]).map(k=>{const tp=typeOf(k);return bar(ms(tp?iconOf(tp.icon,'directions_run'):'directions_run','s')+h(k),100*st.byType[k]/st.acts.length,st.byType[k],tp?tp.color:'#8A8F99');}).join('');
    o+='<h3>By sport</h3><div class="chips">'+Object.keys(st.bySport).sort((a,b)=>st.bySport[b]-st.bySport[a]).map(k=>'<span class="tag" style="--c:'+sportColor(k)+'">'+ms(sportIcon(k),'xs')+h(k)+' · '+st.bySport[k]+'</span>').join('')+'</div>';
    o+='<h3>Sessions</h3>'+st.acts.slice().sort((a,b)=>a.date.localeCompare(b.date)||byCreated(a,b)).map(a=>row2(dShort(a.date),'<span class="tag" style="--c:'+sportColor(a.sport)+'">'+ms(sportIcon(a.sport),'xs')+h(a.sport||'Sport')+'</span>'+h(a.note||''),' data-action="rv-day" data-date="'+a.date+'"')).join('');
    return o;}
  if(key==='people'){
    o='<div class="dk-big">'+st.peopleDays+'<small>'+(st.peopleDays===1?'day':'days')+' with people</small>'+rvDelta(st.peopleDays,pv.peopleDays,0,'',vs)+'</div>';
    if(!st.people.length)return o+'<p class="empty">No one logged in this '+p.kind+'.</p>';
    o+=facts(['<b>'+st.people.length+'</b> '+(st.people.length===1?'entry':'entries'),'longest stretch without <b>'+st.peopleGap+'</b> '+(st.peopleGap===1?'day':'days')]);
    o+='<h3>Who and what</h3>'+st.people.slice().sort((a,b)=>a.date.localeCompare(b.date)||byCreated(a,b)).map(q=>row2(dShort(q.date),'<b>'+h(q.people)+'</b>'+(q.activity?' · '+h(q.activity):''),' data-action="rv-day" data-date="'+q.date+'"')).join('');
    return o;}
  if(key==='tasks'){const pl=st.plan,pp=pv.plan;
    o='<div class="dk-big">'+(pl.follow==null?'–':pl.follow+'%')+'<small>'+(pl.rows.length?pl.done.length+' of '+pl.rows.length+' planned items done':'of the plan done')+'</small>'+rvWas(pl.follow,pp.follow,'last '+p.kind)+'</div>';
    if(!pl.has&&!pl.extra.length)return o+'<p class="empty">Nothing was planned in this '+p.kind+'.</p>';
    o+=facts([pl.moves?'<b>'+pl.moves+'</b> moved':'',pl.skipped.length?'<b>'+pl.skipped.length+'</b> skipped':'',pl.open.length?'<b>'+pl.open.length+'</b> still open':'',pl.ahead.length?'<b>'+pl.ahead.length+'</b> still ahead':'',pl.based?'<b>'+pl.extra.length+'</b> not in the plan':'']);
    if(pl.kinds.length)o+='<h3>Planned and done, by kind</h3>'+pl.kinds.map(x=>bar(ms(PKIND[x.k][1]==='radio_button_unchecked'?'checklist':PKIND[x.k][1],'s')+PKIND[x.k][0],100*x.d/x.p,x.d+' of '+x.p,'var(--accent)')).join('');
    if(pl.logs.length){const mx=pl.reasons.length?pl.reasons[0][1]:1,none=pl.logs.filter(l=>!l.reason).length;o+='<h3>What got in the way</h3>'+pl.reasons.map(q=>bar(h(q[0]),100*q[1]/mx,q[1],'var(--r2)')).join('')+(none?bar('<span style="color:var(--muted)">No reason given</span>',100*none/Math.max(mx,none),none,'var(--line-2)'):'')+'<p class="hint" style="margin:6px 0 0;font-size:12px">'+pl.timing.map(q=>q[1]+' '+(TIMING[q[0]]||q[0])).join(' · ')+'</p>';}
    if(pl.parts.length>1)o+='<h3>Where the plan held</h3>'+pl.parts.map(x=>bar((x.pt?ms(PARTS[x.pt][1],'s')+PARTS[x.pt][0]:'No slot'),100*x.d/x.p,x.d+' of '+x.p,'var(--accent)')).join('')+'<p class="hint" style="margin:6px 0 0;font-size:12px">Done on the day it was first planned for.</p>';
    if(pl.logs.length)o+='<h3>What changed</h3>'+pl.logs.map(l=>row2(l.from&&l.from.date?dShort(l.from.date):'–','<b>'+h(l.title||'')+'</b> '+(l.kind==='skip'?'skipped':'moved to '+pWhere(l.to))+(l.reason?' <span class="tag" style="--c:var(--r2);padding:1px 8px">'+h(l.reason)+'</span>':''),l.v?' data-action="plan-open" data-id="'+l.v.id+'"':'')).join('');
    if(pl.open.length)o+='<h3>Still open</h3>'+pl.open.map(v=>row2(v.date?dShort(v.date):'Week',h(v.title),' data-action="plan-open" data-id="'+v.id+'"',v.date&&v.date<t?'color:var(--danger)':'')).join('');
    if(pl.extra.length)o+='<h3>Done, not in the plan</h3>'+pl.extra.map(x=>row2(x.date?dShort(x.date):'–',ms(x.icon,'s','color:'+x.color)+' '+h(x.title),x.id?' data-action="plan-open" data-id="'+x.id+'"':' data-action="rv-day" data-date="'+x.date+'"')).join('');
    if(wk){const ws=[5,4,3,2,1,0].map(n=>{const w=periodOf('week',addDays(p.start,-7*n));return {w:w,f:n?planStats(w).follow:pl.follow};});if(ws.filter(x=>x.f!=null).length>1)o+='<h3>Last six weeks</h3><div class="bars tall">'+ws.map(x=>'<div class="'+(x.f==null?'none':'')+'" style="height:'+(x.f==null?4:Math.max(4,x.f))+'%'+(x.f==null?'':';--c:'+(x.w.id===p.id?'var(--accent)':'var(--line-2)'))+'" title="'+x.w.label+(x.f==null?'':' · '+x.f+'%')+'" data-action="rv-open-week" data-date="'+x.w.start+'"></div>').join('')+'</div><div class="barlbl">'+ws.map(x=>'<span>'+isoWeek(x.w.start).week+'</span>').join('')+'</div>';}
    return o;}
  if(key==='journal'){
    o='<div class="dk-big">'+st.journaled+'<small>of '+st.dates.length+' days written</small></div>'+facts(['focus set on <b>'+st.focusDays+'</b>',st.core.length?'<b>'+st.core.length+'</b> core memory '+(st.core.length===1?'day':'days'):'']);
    const F=[['all','All'],['recap','Recap'],['highlight','Highlights'],['lowlight','Lowlights'],['learnings','Learnings'],['memory','Memories']],cls={recap:'re',highlight:'hi',lowlight:'lo',learnings:'le',memory:'me'};
    const keys=S.rvJ==='all'?['highlight','lowlight','learnings','memory']:[S.rvJ];
    o+='<div class="jf" role="group" aria-label="Show">'+F.map(f=>'<button class="'+(S.rvJ===f[0]?'on':'')+'" data-action="rv-jf" data-v="'+f[0]+'">'+f[1]+'</button>').join('')+'</div>';
    const rows=st.days.filter(x=>keys.some(k=>x.d[k])).map(x=>'<div class="jday"><button class="jh" data-action="rv-day" data-date="'+x.iso+'"><span class="d">'+dShort(x.iso)+'</span>'+chip(x.d)+'<span>'+h(x.d.focus||'')+'</span></button><div class="jl">'+keys.filter(k=>x.d[k]).map(k=>'<p class="'+cls[k]+'"><span>'+h(x.d[k])+'</span></p>').join('')+'</div></div>').join('');
    return o+(rows||'<p class="empty">Nothing written here in this '+p.kind+'.</p>');}
  if(key==='intent'){
    const irow=x=>'<div class="dk-row nr" style="cursor:default"><span class="d" style="color:'+(INT[x.status]?INT[x.status].c:'var(--muted)')+'">'+(INT[x.status]?(wk?INT[x.status].l:INT[x.status].m):'Open')+'</span><span class="x"><b>'+h(x.text)+'</b>'+(x.why?'<br>'+h(x.why):'')+'</span></div>';
    const wrow=w=>{const l=intents(getPeriod(w)),tl=tally(l);return '<button class="dk-row nr" data-action="rv-open-week" data-date="'+w.start+'"><span class="d">'+w.label+'</span><span class="x">'+(l.length?idots(l)+' '+tl.done+' of '+tl.total+' done':'<span style="color:var(--muted)">none set</span>')+'</span></button>';};
    const own=intents(per),tl=tally(rvIntList(p,per));
    o='<div class="dk-big">'+(tl.total?tl.done+'/'+tl.total:'–')+'<small>'+(wk?'intentions done':'weekly intentions done')+'</small></div>';
    if(tl.total)o+=facts(['<b>'+tl.partly+'</b> partly','<b>'+tl.dropped+'</b> dropped',tl.open?'<b>'+tl.open+'</b> not marked':'']);
    if(wk){
      o+=own.length?'<h3>This week</h3>'+own.map(irow).join(''):'<p class="empty">No intention was set for this week.</p>';
      o+='<h3>Earlier weeks</h3>'+[1,2,3,4].map(n=>wrow(periodOf('week',addDays(p.start,-7*n)))).join('');
    }else{
      o+='<h3>Focus this month</h3>'+(own.length?own.map(irow).join(''):'<p class="empty">No focus was set for this month.</p>');
      const wks=weeksIn(p);o+='<h3>Week by week</h3>'+wks.map(wrow).join('');
      const whys=[];wks.forEach(w=>{const wp=getPeriod(w);intents(wp).forEach(x=>{if(x.why&&(x.status==='partly'||x.status==='dropped'))whys.push([w.label,'<b>'+h(x.text)+'</b><br>'+h(x.why)]);});if(wp.why)whys.push([w.label,h(wp.why)]);});
      if(whys.length)o+='<h3>Why things slipped</h3>'+whys.map(q=>'<div class="dk-row nr" style="cursor:default"><span class="d">'+q[0]+'</span><span class="x">'+q[1]+'</span></div>').join('');
    }
    return o;}
  return o;}
const rvKey=()=>S.rvHover||S.rvPin||S.rvLast||'rating';
const rvHl=()=>S.rvPin&&S.rvPin!=='intent'?' data-hl="'+S.rvPin+'"':'';
function rvDockHTML(){const key=rvKey(),pinned=S.rvPin===key;return '<div class="dk-h"><span class="t">'+ms(RVM[key][1])+RVM[key][2]+'</span><span class="hintx">'+(pinned?'Pinned':canHover()?'Click a card to pin':'')+'</span><button class="ib'+(pinned?' on':'')+'" data-action="rv-pin" data-rvm="'+key+'" aria-label="'+(pinned?'Unpin':'Keep open')+'" title="'+(pinned?'Unpin':'Keep open')+'">'+ms('push_pin',pinned?'fill':'')+'</button></div><div class="dk-b" tabindex="0">'+rvDetail(key)+'</div>';}

function rvWeekCal(p,st){const t=todayISO();return '<div class="rvweek rvcal" id="rvcal"'+rvHl()+'>'+st.days.map(x=>{const iso=x.iso,d=x.d,habs=habsFor(iso),lk=planIdx().linked,based=!!planBaseOf(weekStart(iso)),dot=id=>based&&!lk.has(id)?'<i class="pun" title="Not in the plan"></i>':'',pls=planDay(iso).filter(v=>v.kind!=='routine'&&!v.link),gh=planGhosts(iso);

    if(x.acts.length)inner+='<div class="rsp" data-p="sport">'+x.acts.map(a=>'<div style="--c:'+sportColor(a.sport)+'">'+ms(sportIcon(a.sport),'xs')+'<span>'+h(a.sport||'Sport')+dot(a.id)+(a.note?' <small>· '+h(a.note)+'</small>':'')+'</span></div>').join('')+'</div>';

function rvMonthCal(p){const t=todayISO();const L=S.layers,sel=S.selected;S.layers={rating:true,focus:true,habits:true,sport:true,people:true,tasks:true};S.selected=null;let out='';

function planGridHTML(ws){const t=todayISO();return '<div class="pgrid7">'+range(ws,addDays(ws,6)).map(iso=>'<div class="pday'+(iso===t?' today':'')+'" data-drop="day:'+iso+'"><button class="pdh" data-action="rv-day" data-date="'+iso+'" title="Open '+fmtMid(iso)+'">'+DAYS[dow(iso)]+' <span>'+fromISO(iso).getDate()+'</span></button>'+weekPlanHTML(iso).replace('class="wplan"','class="wplan on"')+'</div>').join('')+'</div>';}
function planLoadHTML(ws){const items=planOfWeek(ws).filter(x=>x.kind!=='routine'),t=todayISO();if(!items.length)return '<p class="hint" style="margin:10px 0 0">Nothing planned yet. Add what you want to do, then drag it onto a day; dropping it on a part of the day places it there.</p>';const n=k=>items.filter(x=>x.kind===k).length,sp=n('sport');let tot=0,wn=0;for(let i=1;i<=6;i++){const a=addDays(ws,-7*i),b=addDays(a,6);if(b>=t)continue;wn++;tot+=Object.values(S.data.activities).filter(x=>x.date>=a&&x.date<=b).length;}const avg=wn?tot/wn:null;const rest=[n('people')?n('people')+' with people':'',n('task')?plural(n('task'),'task'):'',n('event')?plural(n('event'),'event'):'',items.filter(x=>!x.date).length?items.filter(x=>!x.date).length+' not on a day yet':''].filter(Boolean).join(' · ');return '<div class="pload">'+(sp?'<span><i style="background:'+(avg!=null&&sp>avg+1?'var(--r2)':'var(--r5)')+'"></i>'+plural(sp,'sport session')+' planned'+(avg!=null?' · you did '+avg.toFixed(1)+' a week over the last '+(wn===1?'week':wn+' weeks'):'')+'</span>':'')+(rest?'<span>'+rest+'</span>':'')+'</div>';}

function statusBtn(x,ctx){const st=tstatus(x);const subs=tsubs(x);const sd=subs.filter(z=>z.done).length;const C=2*Math.PI*11;const frac=st==='done'?1:(subs.length?sd/subs.length:0);const ring=subs.length?'<svg viewBox="0 0 26 26" aria-hidden="true"><circle class="bg" cx="13" cy="13" r="11"/><circle class="fg" cx="13" cy="13" r="11" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(2)+'"/></svg>':'';return '<button class="st '+st+(subs.length?' hasring':'')+'" data-action="task-done" data-id="'+x.id+'" data-ctx="'+(ctx||'')+'" title="'+STATUS[st].l+(subs.length?' · '+sd+' of '+subs.length+' subtasks':'')+'" aria-label="Toggle done"'+ro()+'>'+ring+ms(STATUS[st].icon,st==='done'?'fill':'')+'</button>';}

function trkHTML(x,opts){const o=opts||{};const st=tstatus(x);const subs=tsubs(x);const sd=subs.filter(z=>z.done).length;const exp=!!S.expanded[x.id];const fading=!!(S.recentDone[x.id]);const xl=exp?'Hide subtasks':subs.length?'Show subtasks':'Add subtasks';const io=!!o.inline&&S.taskOpen===x.id;return '<div class="trk'+(io?' open':'')+(st==='done'?' done':'')+(o.compact?' compact':'')+(o.subtle?' subtle':'')+(fading&&!o.noFade?' fading':'')+'" draggable="true" data-drag="task:'+x.id+'" data-action="'+(o.inline?'task-inline':'task-open')+'" data-id="'+x.id+'"'+(o.inline?' aria-expanded="'+io+'"':'')+'><button class="xp'+(exp?' open':'')+(subs.length?'':' none')+'" data-action="task-expand" data-id="'+x.id+'" title="'+xl+'" aria-label="'+xl+'" aria-expanded="'+exp+'">'+ms('chevron_right')+'</button>'+statusBtn(x,o.ctx)+'<span class="ttw"><span class="tte"'+ceAttr('task',x.id,'','Title')+'>'+h(x.title)+'</span>'+(subs.length?'<span class="subn">'+sd+'/'+subs.length+'</span>':'')+(x.description?'<span class="desc-dot" title="Has notes"></span>':'')+'</span><span class="meta"><span class="m-pr">'+(o.inline?tagBtn(x,'priority'):prioTag(x))+'</span><span class="m-ar">'+(o.inline?tagBtn(x,'area'):(x.area?areaTag(x.area):''))+'</span>'+(o.compact?'':'<span class="m-dt">'+(o.meta?'<span class="tmeta">'+h(o.meta)+'</span>':o.inline?tagBtn(x,'day',true):datePill(x))+'</span>')+'</span></div>'+(io?taskInlineHTML(x,{}):exp?subRowsHTML(x,o.inline?'task-inline':''):'');}
function kmeta(x,byP){const pr=tprio(x),st=tstatus(x),a=areaOf(x.area),t=todayISO(),subs=tsubs(x);let o='';
  if(byP){if(st!=='todo'&&st!=='done')o+='<span class="ki" title="'+STATUS[st].l+'" style="color:'+(st==='stuck'?'var(--danger)':st==='waiting'?'var(--r2)':st==='progress'?'var(--accent)':'var(--muted)')+'">'+ms(STATUS[st].icon)+'</span>';}
  else if(pr!=='none')o+='<span class="ki" title="'+PRIO[pr].l+' priority" style="color:'+PRIO[pr].c+'">'+ms('flag','fill')+'</span>';

/* ---------- export / import ---------- */
function toCSV(rows){const keys=[];rows.forEach(r=>Object.keys(r).forEach(k=>{if(keys.indexOf(k)<0)keys.push(k);}));const esc=v=>{if(v==null)return '';const s=typeof v==='object'?JSON.stringify(v):String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};return [keys.join(',')].concat(rows.map(r=>keys.map(k=>esc(r[k])).join(','))).join('\n');}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=ch;}if(cell!==''||row.length){row.push(cell);rows.push(row);}if(!rows.length)return [];const keys=rows[0];return rows.slice(1).filter(r=>r.some(x=>x!=='')).map(r=>{const o={};keys.forEach((k,i)=>{let v=r[i];if(v===''||v===undefined)return;if(v==='true')v=true;else if(v==='false')v=false;else if(/^-?\d+(\.\d+)?$/.test(v)&&k!=='date')v=Number(v);else if((v[0]==='{'||v[0]==='[')){try{v=JSON.parse(v);}catch(e){}}o[k]=v;});return o;});}
function docId(c,doc){if(c==='days')return doc.date;if(c==='habit_log')return doc.date+'_'+doc.habitId;if(c==='settings')return 'main';return doc.id;}
function importRows(c,rows,batch){let n=0;rows.forEach(doc=>{if(!doc||typeof doc!=='object')return;const id=docId(c,doc);if(id&&/^[A-Za-z0-9_\-.~:@+]+$/.test(String(id))){if(batch)(batch[c]=batch[c]||{})[String(id)]=doc;else Store.put(c,String(id),doc);n++;}});return n;}
function importFile(c,file){const rd=new FileReader();rd.onload=()=>importText(c,String(rd.result),file.name);rd.readAsText(file);}
function importText(c,text,name){const batch=Store.mode==='server'?{}:null;let n=0;try{if(c==='__all'){const obj=JSON.parse(text);if(obj&&obj.lifeos_backup){openSheet({type:'backup',env:obj});return;}COLLS.forEach(k=>{if(obj[k]&&typeof obj[k]==='object')n+=importRows(k,Object.values(obj[k]),batch);});}else if(/\.csv$/i.test(name))n=importRows(c,parseCSV(text),batch);else{const obj=JSON.parse(text);n=importRows(c,Array.isArray(obj)?obj:Object.values(obj),batch);}}catch(e){toast('Couldn’t read that file.');return;}if(batch){Store.importAll(batch,n);return;}toast('Imported '+n+' rows');render(true);}

/* ---------- encrypted backup ---------- */
/* Everything in one file, sealed in this browser: PBKDF2-HMAC-SHA256 turns the
   password into a key, AES-256-GCM locks the export. docs/data-format.md has
   the file format; tools/open-backup.mjs opens one without the app. */
const Backup={ITER:600000,
  b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);},
  bytes(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;},
  async key(pw,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:iter},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);},
  async seal(pw,text){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const data=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},await this.key(pw,salt,this.ITER),new TextEncoder().encode(text));return JSON.stringify({lifeos_backup:1,created:new Date().toISOString(),kdf:'PBKDF2-HMAC-SHA256',iterations:this.ITER,salt:this.b64(salt),cipher:'AES-256-GCM',iv:this.b64(iv),data:this.b64(data)});},
  async open(pw,env){const it=Number(env.iterations);if(env.lifeos_backup!==1||!(it>=1&&it<=10000000))throw new Error('unknown backup format');const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:this.bytes(env.iv)},await this.key(pw,this.bytes(env.salt),it),this.bytes(env.data));return new TextDecoder().decode(data);},
  async go(){const sh=S.sheet;if(!sh||sh.type!=='backup'||sh.busy)return;const pw=sh.pw||'';if(!pw)return toast('Enter the password.');if(!(window.crypto&&crypto.subtle))return toast('This browser can’t encrypt on this address.');
    sh.busy=true;render(true);let msg='';
    try{if(sh.env){let text;try{text=await this.open(pw,sh.env);}catch(e){throw Object.assign(new Error('That password does not open this backup.'),{shown:true});}if(S.sheet===sh)closeSheet();importText('__all',text,'');return;}
      if(Store.mode==='server')await Store.api('POST','api/auth/verify',{password:pw});
      const text=await this.seal(pw,JSON.stringify(S.data));const d=new Date();
      if(S.sheet===sh)closeSheet();Store.download('life-os-backup-'+todayISO()+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.json',text);return;
    }catch(e){if(e.status===401||e.status===423)return;msg=e.code==='throttled'?'Too many wrong passwords. Try again in '+(e.info&&e.info.retry_after)+' s.':e.code==='wrong'?'Wrong password.':e.message;}
    sh.busy=false;if(S.sheet===sh)render(true);toast(msg);}
};

document.addEventListener('pointerdown',e=>{lpEnd();S.held=false;if(e.pointerType==='mouse')return;S.touch=true;if(S.peek){S.peek=false;hideHover();}const hp=document.querySelector('.pop.hold');if(hp&&!hp.contains(e.target))hp.classList.remove('hold');if(e.isPrimary===false||!e.target.closest||S.readOnly)return;
  for(const hd of HOLD){const el=e.target.closest(hd[0]);if(el&&!el.disabled){const lp=LP={x:e.clientX,y:e.clientY,t:setTimeout(()=>{if(LP!==lp)return;LP=null;TS=null;S.held=true;buzz();hd[1](el);},480)};break;}}},true);
document.addEventListener('pointermove',e=>{if(LP&&Math.hypot(e.clientX-LP.x,e.clientY-LP.y)>10)lpEnd();},true);
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,lpEnd,true));
document.addEventListener('click',e=>{if(S.held){S.held=false;e.preventDefault();e.stopPropagation();}},true);
document.addEventListener('contextmenu',e=>{if(S.touch&&e.target.closest&&HOLD.some(hd=>e.target.closest(hd[0])))e.preventDefault();});
document.addEventListener('focusin',typingSync);
document.addEventListener('focusout',()=>setTimeout(typingSync,80));
window.addEventListener('resize',typingSync);
window.addEventListener('scroll',()=>{if(S.peek){S.peek=false;hideHover();}const hd=document.getElementById('thead');if(hd)hd.classList.toggle('scr',window.scrollY>6);},{passive:true});
/* where the keyboard covers the page instead of resizing it, quick add is lifted above it */
if(window.visualViewport){const vv=window.visualViewport,kb=()=>document.documentElement.style.setProperty('--kb',Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop))+'px');vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb);}

/* ---------- routing ---------- */
function route(){const v=location.hash.replace('#',''),was=PAGES.indexOf(viewNow());S.view=v==='today'||VIEW_NAMES[v]?v:isPhone()?'today':'calendar';S.compass=false;S.fabPop=false;app.style.transition=app.style.transform=app.style.opacity='';render(true);window.scrollTo(0,0);S.atNow=S.view==='today';openAtNow();const now=PAGES.indexOf(viewNow());pageIn(was<0||now<0?0:Math.sign(now-was));}
window.addEventListener('hashchange',route);
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>render(),150);});
route();
Store.init();
})();
</script>
