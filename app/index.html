<style>
@font-face{font-family:'Instrument Sans';font-style:italic;font-weight:400 700;font-stretch:100%;font-display:swap;src:url(fonts/instrument-sans-italic-400-700-latin-ext.2c2d6eb0.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Instrument Sans';font-style:italic;font-weight:400 700;font-stretch:100%;font-display:swap;src:url(fonts/instrument-sans-italic-400-700-latin.77210cdd.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400 700;font-stretch:100%;font-display:swap;src:url(fonts/instrument-sans-normal-400-700-latin.2ee17598.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Material Symbols Outlined';font-style:normal;font-weight:400;font-display:block;src:url(fonts/material-symbols-outlined.6d91676e.woff2) format('woff2')}
:root{
  color-scheme:dark;
  --bg:#131716; --surface:#1B201F; --ink:#E6E9E6; --accent:#56B9A4;
  --surface-2:color-mix(in srgb,var(--surface),var(--ink) 5%);
  --line:color-mix(in srgb,var(--surface),var(--ink) 11%);
  --line-2:color-mix(in srgb,var(--surface),var(--ink) 20%);
  --ink-2:color-mix(in srgb,var(--ink) 78%,var(--surface));
  --muted:color-mix(in srgb,var(--ink) 52%,var(--surface));
  --accent-soft:color-mix(in srgb,var(--accent) 22%,var(--surface));
  --accent-ink:var(--bg);
  --danger:#E0786C; --gold:#E3B341;
  --r1:#D47468; --r2:#DFA070; --r3:#B5B189; --r4:#8DBE86; --r5:#45B38A;
  --tint-mix:28%;
  --radius:12px; --radius-s:7px;
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.5;cursor:default}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-weight:500;margin:0}
h1{font-size:26px;line-height:1.15;letter-spacing:-.01em}
h1 span{color:var(--muted);font-weight:400}
h2{font-size:17px;margin:26px 0 8px}
h3{font-size:13px;color:var(--muted);font-weight:500;margin:14px 0 6px}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 20;vertical-align:middle;opacity:0;transition:opacity .15s}
html.ico .ms{opacity:1}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 20}
.ms.s{font-size:16px}
.ms.xs{font-size:13px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;height:52px}
.brand{font-weight:600;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:6px 11px;border-radius:999px;color:var(--ink-2);white-space:nowrap}
.nav button.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.status{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--r5)} .status.busy i{background:var(--r2)} .status.warn i{background:var(--r1)}
.status i{width:6px;height:6px}
.status.ok,.status.busy{opacity:.55}
.status.ok span,.status.busy span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.gear{color:var(--muted);flex:none;margin-right:-6px}
.gear .ms{font-size:20px}
.gear:hover{color:var(--ink)}
.gear.on{background:var(--accent-soft);color:var(--ink)}

main{max-width:1280px;margin:0 auto;padding:18px 16px 70px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:1000px){.layout.with-side{grid-template-columns:minmax(0,1fr) 470px;align-items:start}}
.side{position:sticky;top:66px;max-height:calc(100vh - 84px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
@media (max-width:999px){.side{display:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.head .spacer{flex:1}
.ib{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;color:var(--ink-2)}
.ib:hover{background:var(--surface-2)}
.tb{padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);font-size:13px;background:var(--surface);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tb:hover{border-color:var(--ink-2);color:var(--ink)}
.tb.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.tb.danger{color:var(--danger)}
.tb.sm{padding:3px 9px;font-size:12px}
.tb.ghost{border-color:transparent;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{padding:4px 12px;border-radius:999px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.calhead{gap:8px 10px;margin-bottom:6px}
.calhead .cal-nav{gap:2px!important}
.calhead .chips{gap:5px}
.calhead .chip{padding:3px 8px;font-size:12.5px;white-space:nowrap;gap:5px}
.calhead .ib{width:28px;height:28px}
.calhead .tb[hidden]{display:none}
@media (max-width:640px){.calhead .tools{width:100%;min-width:0;margin-left:0}.calhead .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}}
.calhead .chip i{width:7px;height:7px}
.cal-title{cursor:pointer;border-radius:8px;padding:0 4px;white-space:nowrap;font-size:22px}
.cal-title:hover{background:var(--surface-2)}
.cal-title .ms.swap{font-size:17px;color:var(--muted);margin-left:7px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;font-size:13px;border:1px solid var(--line-2);color:var(--muted);background:var(--surface);display:inline-flex;align-items:center;gap:6px;user-select:none}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.chip.on{color:var(--ink);border-color:var(--ink-2)}
.chip.on i{opacity:1}
.chip.fx{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.chip.fx i{background:var(--accent);opacity:1}
.chipw{position:relative}
.pop{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:8;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:6px;min-width:170px;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pop::before{content:"";position:absolute;top:-6px;left:0;right:0;height:6px}
@media (hover:hover){.chipw:hover .pop{display:block}}
.pop .pt{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:5px 8px;border-radius:7px;font-size:13px;color:var(--ink-2)}
.pop .pt .ms{font-size:16px;color:var(--c,var(--muted))}
.pop .pt:hover{background:var(--surface-2);color:var(--ink)}
.pop .pt.on{background:var(--accent-soft);color:var(--ink)}
.pop .ph{font-size:11px;color:var(--muted);padding:4px 8px 2px}
.sel{padding:6px 8px;border-radius:var(--radius-s);border:1px solid var(--line-2);background:var(--surface-2);font-size:13px;max-width:200px}
.in{width:100%;padding:7px 10px;border-radius:var(--radius-s);border:1px solid var(--line-2);background:var(--surface-2)}
.in:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.in::placeholder,.ta::placeholder{color:var(--muted);opacity:.8}
.ta{width:100%;padding:7px 10px;border-radius:var(--radius-s);border:1px solid var(--line-2);background:var(--surface-2);resize:none;min-height:36px;line-height:1.4}
.ta:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.lab{font-size:12px;color:var(--muted);margin:9px 0 3px}
.hint{color:var(--muted);font-size:13px;margin:0 0 8px}
.empty{color:var(--muted);font-size:13px;margin:4px 0}
.banner{padding:10px 14px;border-radius:var(--radius-s);background:var(--accent-soft);color:var(--ink);font-size:13px;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 6px;border-radius:999px;font-size:12px;border:1px solid var(--c,var(--line-2));color:var(--ink);background:color-mix(in srgb,var(--c,var(--line-2)) 18%,var(--surface));white-space:nowrap}
.tag .ms{font-size:14px;color:var(--c,var(--muted))}
.over{outline:2px dashed var(--accent);outline-offset:-2px}
[draggable="true"]{cursor:grab}

/* calendar */
.calscroll{height:calc(100vh - 190px);min-height:440px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:thin;border-radius:var(--radius);overscroll-behavior:contain}
.mblock{scroll-snap-align:start;padding-bottom:14px}
.mlabel{font-size:13px;color:var(--muted);padding:4px 6px 6px;position:sticky;top:0;background:var(--bg);z-index:2}
.mlabel b{color:var(--ink);font-weight:500}
.weekscroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;gap:12px;overscroll-behavior-x:contain}
.wblock{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.wlabel{font-size:13px;color:var(--muted);padding:2px 4px 6px}
.wlabel b{color:var(--ink);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;color:var(--muted);padding:2px 6px}
.cell{text-align:left;display:flex;flex-direction:column;gap:3px;padding:6px 7px;height:134px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--ink-2);overflow:hidden;position:relative;transition:opacity .15s,border-color .12s}
.cell:hover{border-color:var(--line-2)}
.cell.rated{background:color-mix(in srgb,var(--tint) var(--tint-mix),var(--surface))}
.cell.out{opacity:.4}
.cell.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);max-width:none}
.cell.core{box-shadow:inset 0 0 0 1.5px var(--gold)}
.cell.sel.core{box-shadow:inset 0 0 0 1px var(--ink),inset 0 0 0 2.5px var(--gold)}
.c-top{height:28px;display:flex;justify-content:space-between;align-items:center;flex:none}
.dnw{position:relative;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.dnw .ring{position:absolute;inset:0;width:28px;height:28px}
.dn{font-weight:500;color:var(--ink);font-size:12.5px;line-height:1;position:relative;z-index:1}
.cell.today .dnw::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent);z-index:0}
.cell.today .dn{color:var(--accent-ink)}
.dnw.core .dn{color:var(--gold);font-weight:600}
.cell.today .dnw.core .dn{color:var(--accent-ink)}
.dnw.core::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px dashed var(--gold);opacity:.75;animation:ringspin 16s linear infinite}
.dnw.core .spark{position:absolute;top:-6px;right:-7px;font-size:12px;color:var(--gold);z-index:2}
.c-sport{height:auto;flex:none;display:flex;gap:3px;align-items:center;justify-content:flex-end;overflow:hidden;max-width:calc(100% - 32px);flex-wrap:wrap}
.c-sport .ms{font-size:16px;color:var(--c)}
.rt{display:inline-flex;align-items:center;gap:4px;min-width:12px}
.rt .ms{color:var(--gold)}
.ringw{position:relative;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ring{width:18px;height:18px;transform:rotate(-90deg);display:block}
.ring .bg{fill:none;stroke:var(--line-2);stroke-width:2.6}
.ring .fg{fill:none;stroke:var(--rc,var(--line-2));stroke-width:2.6;stroke-linecap:round;transition:stroke-dashoffset .25s}
.ringw.core .ring .bg{stroke:color-mix(in srgb,var(--gold) 30%,transparent)}
.ringw.core .ring .fg{stroke:var(--gold)}
.ringw.core::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px dashed var(--gold);opacity:.75;animation:ringspin 16s linear infinite}
.ringw.core::after{content:"";position:absolute;inset:-5px;border-radius:50%;box-shadow:0 0 9px 1px color-mix(in srgb,var(--gold) 50%,transparent);pointer-events:none}
.ringw.core .ms{position:absolute;font-size:10px;color:var(--gold)}
.ringw.lg,.ringw.lg .ring{width:26px;height:26px}
.ringw.lg .ms{font-size:14px}
@keyframes ringspin{to{transform:rotate(360deg)}}
.grid.tagged .c-hab .ms:not(.fh),.grid.tagged .hab-mini .ms:not(.fh){opacity:.08}
.grid.tagged .c-hab .ms.fh,.grid.tagged .hab-mini .ms.fh{opacity:1}
.grid.tagged .c-sport .ms:not(.fh),.grid.tagged .sp span:not(.fh){opacity:.12}
.c-focus{height:30px;flex:none;color:var(--ink);line-height:1.25;font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-hab{height:18px;flex:none;display:flex;gap:3px;align-items:center;overflow:hidden}
.c-hab .ms{font-size:15px;color:var(--line-2)}
.c-hab .ms.fill{color:var(--c)}
.c-hab .ms.miss{color:color-mix(in srgb,var(--c) 45%,var(--line-2))}
.c-ppl,.c-task{height:16px;flex:none;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap}
.c-ppl .ms,.c-task .ms{font-size:13px;flex:none}
.c-task.all{color:var(--r5)}
.grid.no-focus .c-focus,.grid.no-habits .c-hab,.grid.no-sport .c-sport,.grid.no-people .c-ppl,.grid.no-tasks .c-task{visibility:hidden}
.grid.no-rating .dnw .ring,.grid.no-rating .dnw::before,.grid.no-rating .dnw .spark{visibility:hidden}
.grid.no-rating .dnw.core .dn{color:var(--ink);font-weight:500}
.grid.fx .cell:not(.hit){opacity:.28}
.grid.fx .cell.hit{box-shadow:inset 0 0 0 1.5px var(--fxc,var(--accent))}
.grid.fx-rating .cell.hit{--tint-mix:55%}
.grid.fx-sport .cell > :not(.c-top):not(.c-sport),.grid.fx-habits .cell > :not(.c-top):not(.c-hab),.grid.fx-people .cell > :not(.c-top):not(.c-ppl),.grid.fx-tasks .cell > :not(.c-top):not(.c-task),.grid.fx-focus .cell > :not(.c-top):not(.c-focus){opacity:.22}
@media (max-width:640px){
  .grid{gap:3px}
  .cell{padding:4px;gap:2px;height:88px}
  .c-top{height:24px}
  .dnw,.dnw .ring{width:24px;height:24px}
  .dn{font-size:11px}
  .c-sport .ms{font-size:13px}
  .c-focus{display:none}
  .calscroll{height:calc(100vh - 160px);min-height:380px}
  .c-hab{height:14px;gap:1px}
  .c-hab .ms{font-size:12px}
  .c-sport{height:14px}
  .c-sport .ms{font-size:12px}
  .c-ppl,.c-task{height:13px;font-size:10px}
  .c-ppl span,.c-task span{display:none}
}
.week{grid-template-columns:repeat(7,minmax(0,1fr))}
@media (max-width:900px){.week{grid-template-columns:1fr}}
.wcard{text-align:left;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2);min-height:150px;transition:opacity .15s}
.wcard.rated{background:color-mix(in srgb,var(--tint) var(--tint-mix),var(--surface))}
.wcard.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);max-width:none}
.wcard.core{box-shadow:inset 0 0 0 1.5px var(--gold)}
.whd{display:flex;flex-direction:column;gap:6px;min-width:0}
.wcard .wd{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-weight:500}
.wcard .wd small{color:var(--muted);font-weight:400;display:inline-flex;align-items:center;gap:3px}
.wcard.today .wd span:first-child{color:var(--accent)}
.wcard .focus{color:var(--ink);line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hab-mini{display:flex;gap:4px;flex-wrap:wrap}
.hab-mini .ms{font-size:18px;color:var(--line-2)}
.hab-mini .ms.fill{color:var(--c)}
.hab-mini .ms.miss{color:color-mix(in srgb,var(--c) 45%,var(--line-2))}
.sp{display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.3}
.sp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c);display:inline-flex;align-items:center;gap:3px}
.sp .ms{font-size:14px}
.wcard .tk{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.wcard .tk span.d{text-decoration:line-through;opacity:.6}
.ppl{font-size:12px;color:var(--ink-2);display:flex;gap:5px;align-items:center}
.ppl .ms{font-size:14px;color:var(--muted)}
.quote{color:var(--ink-2);font-style:italic;font-size:12px;line-height:1.35;margin-top:auto}
.grid.fx .wcard:not(.hit){opacity:.28}
.wcard .focus,.wcard .hab-mini,.wcard .sp,.wcard .ppl,.wcard .tk{display:none}
.grid.l-focus .wcard .focus,.grid.l-habits .wcard .hab-mini,.grid.l-sport .wcard .sp,.grid.l-people .wcard .ppl,.grid.l-tasks .wcard .tk{display:flex}
.grid.l-focus .wcard .focus{display:-webkit-box}
.grid.fx .wcard.hit{box-shadow:inset 0 0 0 1.5px var(--fxc,var(--accent))}
#hover{position:fixed;z-index:12;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;width:260px;font-size:12.5px;color:var(--ink-2);box-shadow:0 10px 30px rgba(0,0,0,.3);display:none;line-height:1.4}
#hover.show{display:block}
#hover .hd{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-weight:500;margin-bottom:4px}
#hover .hd .rt{font-size:12px}
#hover .row{display:flex;gap:6px;align-items:flex-start;margin-top:3px}
#hover .row .ms{font-size:15px;flex:none;margin-top:1px}
#hover .fo{color:var(--ink)}
#hover .hab-mini .ms{font-size:16px}
#hover .q{font-style:italic;margin-top:4px}

/* editor */
.editor{display:flex;flex-direction:column;gap:2px}
.ed-head{display:flex;align-items:center;gap:4px;margin-bottom:6px;overscroll-behavior-x:contain;touch-action:pan-y}
.ed-title{flex:1;min-width:0}
.ed-date{font-weight:500;font-size:15px;line-height:1.2}
.ed-meta{font-size:11.5px;color:var(--muted)}
.rating{display:flex;gap:5px;align-items:center}
.rb{flex:1;height:32px;border-radius:var(--radius-s);border:1px solid var(--line-2);color:var(--ink-2);font-weight:500;background:var(--surface-2)}
.rb.on{background:var(--c);border-color:var(--c);color:#fff}
.core-btn{width:42px;height:32px;border-radius:var(--radius-s);border:1px solid var(--line-2);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.core-btn.on{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--surface))}
.hrow{display:flex;flex-wrap:wrap;gap:6px}
.hb{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.hb .ms{font-size:21px;color:var(--muted)}
.hb.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.hb.on .ms{color:var(--c)}
.hb.future{opacity:.35;border-style:dashed}
.rows{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.rowl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 26px;gap:5px;width:100%;align-items:center}
.rowl .sel{max-width:none;padding:6px 8px;width:100%}
.rowl .in{padding:6px 9px}
.rowl .ib{width:26px;height:26px;font-size:17px}
.newsport{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:5px;width:100%;padding:6px;border:1px dashed var(--line-2);border-radius:var(--radius-s)}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.jgrid .lab{margin-top:6px}
.tlist{display:flex;flex-direction:column;gap:1px;margin-bottom:4px}
.trow{display:flex;align-items:center;gap:8px;padding:4px 4px;border-radius:var(--radius-s);font-size:13.5px}
.trow:hover{background:var(--surface-2)}
.trow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0;flex:none}
.trow .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.trow.subtle{opacity:.6}
.tmeta{font-size:11px;color:var(--muted);white-space:nowrap}

/* review */
.rv-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat-k{font-size:12px;color:var(--muted)}
.stat-v{font-size:30px;font-weight:500;line-height:1.1;margin:4px 0 8px;letter-spacing:-.01em}
.stat-v small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.bars{display:flex;align-items:flex-end;gap:2px;height:48px}
.bars div{flex:1;background:var(--c,var(--line-2));border-radius:2px 2px 0 0;min-height:2px}
.bars div.none{background:var(--line)}
.barlbl{display:flex;gap:2px;font-size:10px;color:var(--muted)}
.barlbl span{flex:1;text-align:center}
.hr{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.hr .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px}
.hr .n .ms{font-size:16px;color:var(--c)}
.hr .bar{flex:2;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.hr .bar i{display:block;height:100%;background:var(--c);width:var(--w)}
.hr .v{width:44px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}
.cols .ta{min-height:140px}
details{font-size:13px;color:var(--ink-2)}
details summary{cursor:pointer;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"›";display:inline-block;transition:transform .15s;color:var(--muted);width:10px}
details[open] summary::before{transform:rotate(90deg)}
details .prev{white-space:pre-wrap;margin-top:6px;padding:10px;background:var(--surface-2);border-radius:var(--radius-s)}
.daylist{display:flex;flex-direction:column;gap:6px}
.drow{display:grid;grid-template-columns:70px 28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:13px}
.drow .dd{color:var(--ink);font-weight:500}
.drow .dd small{display:block;color:var(--muted);font-weight:400}
.drow .rr{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;color:#fff;background:var(--c,var(--line-2))}
.drow .rr .ms{font-size:15px}
.drow .body{color:var(--ink-2);line-height:1.4}
.drow .body b{font-weight:500;color:var(--ink)}
.drow .body p{margin:2px 0}
.drow:hover{border-color:var(--line-2)}

/* review: the sitting */
.rv-head .spacer{flex:1}
.rvlay{display:block}
.rvh{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500;margin:26px 0 10px}
.rvh:first-child{margin-top:0}
.rvh .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);color:var(--muted);font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-variant-numeric:tabular-nums}
.rvh small{font-size:13px;color:var(--muted);font-weight:400}
.rvsub{font-size:13px;color:var(--muted);font-weight:500;margin:16px 0 6px}
.rvcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.rvc{position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 11px 9px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);min-width:0;transition:border-color .12s,background .12s}
.rvc:hover,.rvc.on{border-color:var(--line-2);background:var(--surface-2)}
.rvc.pin{border-color:var(--accent);background:var(--accent-soft)}
.rvc .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.rvc .k .ms{font-size:14px}
.rvc .v{font-size:22px;font-weight:500;line-height:1.2;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.rvc .v small{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:4px;letter-spacing:0}
.rvc .viz{display:flex;align-items:flex-end;gap:1.5px;height:20px;margin-top:4px}
.rvc .viz i{flex:1;min-width:0;border-radius:1.5px;background:var(--line);height:100%}
.rvc .viz.strip i{height:8px;border-radius:2px}
.rvc .viz.bar i{height:8px;border-radius:2px;flex:var(--f,1)}
.rvc .pinmark{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;display:none;align-items:center;justify-content:center}
.rvc.pin .pinmark{display:inline-flex}
.dl{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.up{color:var(--r5)} .dl.dn{color:var(--r1)}
.rvc .k .dl{margin-left:auto;padding-left:4px}

/* detail dock */
.rvdock{display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-top:10px;overflow:hidden}
.rvdock.pinned{display:flex;flex-direction:column;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:6;max-height:46vh;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.rvdock.is{border-color:var(--accent)}
.dk-h{display:flex;align-items:center;gap:8px;padding:9px 8px 8px 14px;border-bottom:1px solid var(--line);flex:none}
.dk-h .t{font-weight:500;display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.dk-h .t .ms{font-size:17px;color:var(--muted)}
.dk-h .hintx{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dk-h .ib.on{color:var(--accent)}
.dk-h .ib .ms{font-size:18px}
.dk-b{padding:12px 14px 16px;overflow:auto;scrollbar-width:thin;overscroll-behavior:contain;font-size:13px;color:var(--ink-2);min-height:0}
.dk-b h3{margin:16px 0 6px}
.dk-big{font-size:30px;font-weight:500;line-height:1.1;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.dk-big small{font-size:12.5px;color:var(--muted);font-weight:400;letter-spacing:0}
.dk-facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.dk-facts span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.dk-facts b{font-weight:500;color:var(--ink)}
.bars.tall{height:72px;gap:3px}
.bars.tall div{border-radius:3px 3px 0 0;cursor:pointer}
.dk-row{display:grid;grid-template-columns:58px 22px minmax(0,1fr);gap:8px;align-items:start;width:100%;text-align:left;padding:5px 6px;margin:0 -6px;border-radius:7px;font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.dk-row.nr{grid-template-columns:58px minmax(0,1fr)}
.dk-row:hover{background:var(--surface-2)}
.dk-row .d{color:var(--muted);white-space:nowrap}
.rchip{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;color:#fff;background:var(--c,var(--line));flex:none}
.dk-row .x b{font-weight:500;color:var(--ink)}
.dk-row .x .tag{margin-right:4px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 34px 34px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.pair .pb{display:flex;flex-direction:column;gap:2px}
.pair .pb i{display:block;height:5px;border-radius:3px;background:var(--accent);width:var(--w)}
.pair .pb i + i{background:var(--line-2)}
.pair .nv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.pair .nv + .nv{color:var(--muted)}
.pair-h{display:grid;grid-template-columns:minmax(0,1fr) 34px 34px;gap:8px;font-size:11px;color:var(--muted)}
.pair-h span{text-align:right}
.hgridw{overflow-x:auto;scrollbar-width:thin;margin:0 -14px;padding:0 14px 4px}
.hgrid{display:grid;gap:3px 2px;align-items:center;font-size:12px;width:max-content;min-width:100%}
.hgrid .hn{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:-14px;background:var(--surface);padding:1px 6px 1px 0;z-index:1;color:var(--ink)}
.hgrid .hn .ms{font-size:15px;color:var(--c)}
.hgrid .hh{font-size:10px;color:var(--muted);text-align:center}
.hgrid i{display:block;aspect-ratio:1;border-radius:3px;border:1px solid var(--line-2)}
.hgrid i.on{background:var(--c);border-color:var(--c)}
.hgrid i.off{border-color:transparent;background:none}
.hgrid i.fut{border-style:dashed;opacity:.5}
.hgrid.mo{gap:3px 1px}
.hgrid.mo i{aspect-ratio:auto;height:14px;border:0;border-radius:1.5px;background:var(--line)}
.hgrid.mo i.on{background:var(--c)}
.hgrid.mo i.off{background:none}
.hgrid.mo i.fut{opacity:.4}
.hgrid.mo .hh{overflow:visible;white-space:nowrap}
.hgrid .hv{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-left:6px;white-space:nowrap}
.hr.cmp .n{flex:0 0 104px}
.hr.cmp .bar{flex:1}
.hr.cmp .v{white-space:nowrap}
.hist{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;height:118px;margin:14px 0 10px}
.hc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.hc .hn{font-size:12px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.hc i{display:block;width:100%;height:calc(var(--h) * .68px);min-height:3px;border-radius:5px 5px 2px 2px;background:var(--c)}
.hc.zero i{background:var(--line)}
.hc b{width:100%;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:500;color:var(--ink);background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.avgm{position:absolute;top:-10px;bottom:24px;width:0;border-left:1px dashed var(--ink-2);opacity:.6;pointer-events:none}
.avgm::before{content:attr(data-l);position:absolute;top:0;left:5px;font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.avgm.r::before{left:auto;right:5px}
.jf{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.jf button{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.jf button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jday{padding:8px 0;border-top:1px solid var(--line)}
.jday:first-of-type{border-top:0}
.jday .jh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;color:var(--ink);font-weight:500;font-size:12.5px;margin-bottom:2px}
.jday .jh .d{color:var(--muted);font-weight:400;white-space:nowrap}
.jl{display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.4;color:var(--ink-2)}
.jl p{margin:0;display:grid;grid-template-columns:14px minmax(0,1fr);gap:4px;white-space:pre-wrap}
.jl p::before{content:var(--m);color:var(--mc,var(--muted));font-weight:600}
.jl .hi{--m:"↑";--mc:var(--r5)} .jl .lo{--m:"↓";--mc:var(--r1)} .jl .le{--m:"→";--mc:var(--accent)} .jl .me{--m:"✦";--mc:var(--gold)} .jl .re{--m:"·"}
.idots{display:inline-flex;gap:3px;align-items:center}
.idots i{width:9px;height:9px;border-radius:50%;background:var(--c,transparent);border:1px solid var(--c,var(--line-2));display:block}

/* review calendar */
.rvrest{container-type:inline-size;container-name:rv;min-width:0}
.rvweek{display:grid;grid-template-columns:1fr;gap:4px}
@container rv (min-width:660px){.rvweek{grid-template-columns:repeat(7,minmax(0,1fr))}}
.rvd{text-align:left;display:flex;flex-direction:column;gap:6px;padding:9px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);min-width:0;transition:border-color .12s}
@container rv (min-width:660px){.rvd{min-height:190px}}
.rvd:hover{border-color:var(--line-2)}
.rvd.rated{background:color-mix(in srgb,var(--tint) var(--tint-mix),var(--surface))}
.rvd.core{box-shadow:inset 0 0 0 1.5px var(--gold)}
.rvd.fut{opacity:.55}
.rvd .wd{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-weight:500;font-size:13px}
.rvd.today .wd span:first-child{color:var(--accent)}
.rvd .focus{color:var(--ink);line-height:1.3;font-weight:500}
.rvd .hab-mini .ms{font-size:16px}
.rvd .wd small{display:inline-flex;align-items:center}
.rsp{display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.3}
.rsp>div{display:grid;grid-template-columns:15px minmax(0,1fr);gap:3px;color:var(--c)}
.rsp .ms{font-size:14px}
.rsp small{color:var(--ink-2);font-size:inherit}
.rvd .tk{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.rvd .tk span.d{text-decoration:line-through;opacity:.6}
.rvd .ppl{align-items:flex-start}
.rvd .ppl .ms{margin-top:1px}
.rvd .jl p span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rvd .none{color:var(--muted);font-size:12px}
.rvcal [data-p],.rvcal .cell>div,.rvcal .cell .c-sport,.rvcal .cell .ring{transition:opacity .12s}
.rvcal[data-hl] [data-p]{opacity:.18}
.rvcal[data-hl="rating"] [data-p="rating"],.rvcal[data-hl="habits"] [data-p="habits"],.rvcal[data-hl="sport"] [data-p="sport"],.rvcal[data-hl="people"] [data-p="people"],.rvcal[data-hl="tasks"] [data-p="tasks"],.rvcal[data-hl="journal"] [data-p="journal"]{opacity:1}
.rvcal[data-hl] .cell>div{opacity:.18}
.rvcal[data-hl] .cell>.c-top,.rvcal[data-hl="habits"] .cell>.c-hab,.rvcal[data-hl="people"] .cell>.c-ppl,.rvcal[data-hl="tasks"] .cell>.c-task,.rvcal[data-hl="journal"] .cell>.c-focus{opacity:1}
.rvcal[data-hl]:not([data-hl="sport"]) .cell .c-sport{opacity:.18}
.rvcal[data-hl]:not([data-hl="rating"]) .cell .ring{opacity:.25}
.rvcal[data-hl="rating"] .cell.rated,.rvcal[data-hl="rating"] .rvd.rated{--tint-mix:52%}
.rvmonth{display:flex;flex-direction:column;gap:6px}
.rvw{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
@container rv (min-width:820px){.rvw{grid-template-columns:minmax(0,1fr) 236px;gap:8px}}
.rvw-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.rvw:not(.dh) .rvw-days .cell{height:auto;min-height:134px}
@media (max-width:640px){.rvw:not(.dh) .rvw-days .cell{min-height:88px}}
.rvw.dh .dow{padding:0 6px}
.rvw-side{display:flex;flex-direction:column;gap:5px;padding:8px 10px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);min-width:0}
.rvw-side.cur{border-color:var(--line-2)}
.wk-h{display:flex;align-items:center;gap:6px;width:100%;text-align:left;color:var(--ink);font-weight:500;font-size:13px;border-radius:6px;margin:-2px -4px;padding:2px 4px}
.wk-h:hover{background:var(--surface-2)}
.wk-h .rg{color:var(--muted);font-weight:400;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-h b{white-space:nowrap}
.wk-h .ms{font-size:16px;color:var(--muted)}
.wk-h .ms.ok{color:var(--r5)}
.wk-s{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wk-s span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.wk-s .ms{font-size:14px;color:var(--muted)}
.wk-c p{margin:0 0 3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wk-c b{font-weight:500;color:var(--muted);font-size:11.5px;margin-right:4px}
.wk-c .none{color:var(--muted)}
@container rv (max-width:819px){.rvw-side{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:8px}.wk-h{width:auto}.wk-c{flex-basis:100%}}

/* check, conclude, next */
.rvbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.rvbox + .rvbox{margin-top:8px}
.rvbox .bh{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rvbox .bh .spacer{flex:1}
.irow{display:grid;grid-template-columns:auto minmax(0,1fr) 26px;gap:6px;align-items:center;padding:3px 0}

.pday{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 7px 4px;min-width:0}
.pday.today{border-color:var(--line-2)}
.pdh{display:block;width:100%;text-align:left;font-size:12.5px;font-weight:500;color:var(--ink);padding:0 0 3px}
.pdh span{color:var(--ink-2);font-weight:400}
.pday.today .pdh{color:var(--accent)}
.pload{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.pload i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.pload span + span{color:var(--muted)}
.pdev{display:grid;grid-template-columns:44px minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:4px 10px;align-items:center;padding:4px 0;font-size:13px;color:var(--ink-2)}
.pdev .d{color:var(--muted);font-size:12.5px}
.pdev .n{display:inline-flex;align-items:center;gap:6px;min-width:0;color:var(--ink);text-align:left}
.pdev .n span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdev .n .ms{font-size:15px;color:var(--c,var(--muted));flex:none}
.pdev .n:hover span{text-decoration:underline}
.pdev .w{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdev .w small{color:var(--muted);font-size:inherit}
.pdev .sel{padding:2px 6px;font-size:12px;max-width:150px}
.pdev .sel.set{border-color:var(--r2);background:color-mix(in srgb,var(--r2) 18%,var(--surface));color:var(--ink)}
@container rv (max-width:560px){.pdev{grid-template-columns:44px minmax(0,1fr) auto}.pdev .w{grid-column:2 / -1}}
.rpl{display:flex;flex-direction:column;gap:2px}
.rpl .pchip.sm{height:auto;min-height:20px;border:0;background:none;padding:0;gap:4px}
.rpl .pchip.sm .ptt{white-space:normal;line-height:1.3}
.rpl .pchip.sm .ms{margin-top:1px;align-self:flex-start}
.rsp .pun,.ppl .pun{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}

#why{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;flex-wrap:wrap;align-items:center;gap:6px;width:max-content;max-width:min(94vw,780px);padding:9px 10px 9px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px;z-index:19}
#why.show{display:flex}
#why .wt{display:inline-flex;align-items:center;gap:6px;margin-right:4px;color:var(--ink)}
#why .wt .ms{color:var(--r2)}
#why .ib{width:26px;height:26px;font-size:17px}

/* settings */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.sec h2{margin:0 0 4px;font-size:16px}
.sec .hint{margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);text-align:center}
.tile:hover{border-color:var(--line-2)}
.tile .ms{font-size:26px;color:var(--c)}
.tile span{font-size:12.5px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.add{border-style:dashed;color:var(--muted);background:none}
.tile.add .ms{color:var(--muted)}
.faded{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.faded button{font-size:12px;color:var(--muted);padding:2px 9px 2px 6px;border-radius:999px;border:1px solid transparent;opacity:.55;display:inline-flex;gap:5px;align-items:center}
.faded button .ms{font-size:14px}
.faded button:hover{opacity:1;border-color:var(--line-2)}
.typerow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 4px;border-top:1px solid var(--line);border-radius:6px}
.typerow:first-of-type{border-top:0}
.typerow .th{display:inline-flex;align-items:center;gap:6px;min-width:120px;font-size:13px;color:var(--ink);padding:2px 8px 2px 2px;border-radius:999px}
.typerow .th:hover{background:var(--surface-2)}
.typerow .th .ms{color:var(--c);font-size:18px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:50%;background:var(--c);opacity:.4;border:2px solid transparent}
.sw button.on{opacity:1;border-color:var(--ink)}
.colors{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center}
.colors label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.colors input[type=color]{width:34px;height:26px;border:1px solid var(--line-2);border-radius:6px;background:none;padding:1px}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;margin-top:6px;max-height:200px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:var(--radius-s)}
.icongrid button{height:40px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.icongrid button .ms{font-size:22px}
.icongrid button:hover{background:var(--surface-2)}
.icongrid button.on{background:var(--accent-soft);color:var(--ink)}
.schema details{margin-top:6px}
.schema details > summary{font-size:14px;color:var(--ink);padding:8px 0}
.schema .desc{font-size:13px;color:var(--muted);margin:0 0 8px 16px}
.tw{overflow-x:auto;margin:6px 0 8px 16px;border:1px solid var(--line);border-radius:var(--radius-s)}
.table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.table th,.table td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.table th{color:var(--ink);font-weight:500;background:var(--surface-2);position:sticky;top:0}
.table th small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.table tr:last-child td{border-bottom:0}
.schema .acts{margin-left:16px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.sheet-bg{align-items:center;padding:20px}}
.sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet .sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet .sh h2{flex:1;margin:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.acts .spacer{flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* demo note, sign-in and lock */
.banner.demo{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 12px;font-size:12.5px}
.banner.demo span{flex:1;min-width:0}
.banner.demo .ib{width:26px;height:26px;font-size:17px;flex:none}
#gate{position:fixed;inset:0;z-index:30;display:none;overflow:auto;background:var(--bg);padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
#gate.show{display:flex}
.gbox{width:100%;max-width:320px;margin:auto;display:flex;flex-direction:column;gap:10px;text-align:center}
.gbox h1{margin-bottom:4px}
.gbox .hint{margin:0}
.gbox .in{padding:10px 12px}
.gbox .tb{justify-content:center;padding:9px 14px;font-size:14px;white-space:normal}
.gbox .tb.ghost{font-size:13px;padding:6px 12px;background:none;align-self:center}
.gbox .tb.sm{display:inline-flex;font-size:12px;padding:3px 9px}
.gmsg{min-height:20px;font-size:13px;color:var(--muted);margin:0}
.gmsg.err{color:var(--danger)}
.pgrid{display:block;width:100%;max-width:252px;aspect-ratio:1;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pgrid.sm{max-width:204px}
.pgrid .pg-o{fill:var(--surface);stroke:var(--line-2);stroke-width:2;transition:fill .12s,stroke .12s}
.pgrid .pg-i{fill:var(--muted);transition:fill .12s}
.pgrid .pg-l{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.pgrid .pg-d.on .pg-o{stroke:var(--accent);fill:var(--accent-soft)}
.pgrid .pg-d.on .pg-i{fill:var(--accent)}
.pgrid.bad .pg-l{stroke:var(--danger)}
.pgrid.bad .pg-d.on .pg-o{stroke:var(--danger);fill:color-mix(in srgb,var(--danger) 18%,var(--surface))}
.pgrid.bad .pg-d.on .pg-i{fill:var(--danger)}
.devrow{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:13px;color:var(--ink-2)}
.devrow>span{display:inline-flex;align-items:center;gap:8px}

/* phone: the day as a page with the compass on top, the sections in a bar at the bottom, quick add in the middle.
   The same width decides what the script draws (PHONE). Nothing here applies to a wider window. */
.tabs,#quick,.pinx{display:none}
#hover.hp{width:auto}
#hover .hpk{display:grid;grid-template-columns:repeat(7,15px);gap:4px;margin-top:6px}
#hover .hpk b{font-size:10px;font-weight:400;color:var(--muted);text-align:center}
#hover .hpk i{display:block;aspect-ratio:1;border-radius:4px;border:1px solid var(--line-2)}
#hover .hpk i.on{background:var(--c);border-color:var(--c)}
#hover .hpk i.off{border-color:transparent}
#hover .hpk i.fut{border-style:dashed;opacity:.5}
.pop.hold{display:block;position:fixed;z-index:20;max-height:60vh;overflow:auto;animation:popin .12s ease-out}
@keyframes tick{0%{transform:scale(.55)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes dim{0%,35%{color:var(--ink)}}
@media (hover:none){[draggable="true"]{-webkit-user-drag:none}.pin{position:relative}.pin>.in{padding-right:34px}.pinx{display:inline-flex;position:absolute;top:2px;right:2px;width:30px;height:30px;color:var(--muted)}}
@media (max-width:699px){
  .topbar{position:static;height:0;padding:0;border:0;overflow:hidden;visibility:hidden}
  main{padding:12px 16px calc(92px + env(safe-area-inset-bottom,0px))}
  button,[role="button"],.cell,.wcard,summary,label{-webkit-tap-highlight-color:transparent}
  .tb,.ib,.chip,.hb,.rb,.core-btn,.rvc,.tile,.pst,.fab,.ctile{transition:transform .12s,background .12s,border-color .12s,color .12s}
  .tb:active,.chip:active,.hb:active,.rb:active,.core-btn:active,.rvc:active,.tile:active,.ctile:active{transform:scale(.96)}
  .ib:active,.pst:active{transform:scale(.88)}
  .cell,.wcard,.hb,.chip,.tdt,.fab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .cell:active{border-color:var(--line-2)}
  .pin{position:relative}
  .pin>.in{padding-right:36px}
  .pinx{display:inline-flex;position:absolute;top:3px;right:2px;width:32px;height:32px;color:var(--muted)}
  #toast{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  #why{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  html.qa-on #toast,html.qa-on #why{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
  /* a page moves sideways under the finger, so only up and down is left to the browser */
  main{touch-action:pan-y pinch-zoom}
  html,body{overflow-x:clip}
  /* the calendar: one month, as tall as the screen allows (calFit), or one week */
  .calscroll{height:auto;min-height:0;overflow:visible;scroll-snap-type:none;touch-action:none}
  .calscroll .mblock{padding-bottom:0;margin-bottom:-24px}
  .calscroll .cell{height:var(--ch,88px)}
  .weekscroll{overflow:visible}
  .rvdock.pinned{top:calc(8px + env(safe-area-inset-top,0px))}
  .sheet{padding-top:4px;overscroll-behavior:none}
  .sheet-bg{touch-action:none}
  html:has(#sheet .sheet-bg){overscroll-behavior-y:none}
  .sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 6px}

  /* the bar at the bottom */
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:12;height:calc(58px + env(safe-area-inset-bottom,0px));padding:0 4px env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
  html.typing .tabs,html.qa-on .tabs{transform:translateY(105%)}
  .tabs button[data-nav]{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink-2);opacity:.82;transition:color .15s,opacity .15s}
  .tabs button[data-nav] .ms{font-size:22px;transition:transform .15s}
  .tabs button[data-nav]:active .ms{transform:scale(.86)}
  .tabs button.on{color:var(--accent);font-weight:600;opacity:1}
  .fabw{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
  .fab{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center}
  .fab .ms{font-size:24px}
  .fab:active{transform:scale(.9)}
  .fabw .pop{display:block;top:auto;bottom:calc(100% + 2px);left:50%;margin-left:-85px;z-index:21;animation:popin .12s ease-out}
  .sdot{position:absolute;top:8px;left:50%;margin-left:17px;width:7px;height:7px;border-radius:50%;background:var(--r5);border:1.5px solid var(--surface);box-sizing:content-box;opacity:.9;pointer-events:none;transition:background .2s}
  .sdot.busy{background:var(--r2)} .sdot.warn{background:var(--r1)} .sdot.demo,.sdot.ok{display:none}

  /* the day as a page: the date, and under it the compass */
  #app>.tday:first-child{margin-top:-12px}
  .thead{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;margin:0 -16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);border-radius:0 0 14px 14px;touch-action:none;transition:border-radius .2s,box-shadow .25s}
  .thead.scr{box-shadow:0 10px 22px rgba(0,0,0,.2)}
  .thead.open{border-radius:0;border-bottom-color:transparent;box-shadow:none}
  .tdt{display:flex;align-items:baseline;gap:9px;width:100%;height:44px;padding-top:8px;text-align:left;font-size:19px;font-weight:500;letter-spacing:-.01em;line-height:1.2;white-space:nowrap}
  .tdt small{font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted)}
  .tdt.off small{color:var(--accent)}
  .cps{display:flex;align-items:center;gap:7px;height:40px;margin-top:-3px}
  .cps>.ms{font-size:16px;flex:none;color:var(--accent);opacity:.85}
  .cfo{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid transparent;border-radius:0;padding:5px 0;color:var(--ink-2);text-overflow:ellipsis;-webkit-user-select:text;user-select:text}
  .cfo::placeholder{color:var(--muted);opacity:.7}
  .cfo:focus{outline:none;border-bottom-color:var(--accent);color:var(--ink)}
  .cbtn{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding-left:8px;margin-right:-5px;color:var(--muted)}
  .cbtn>.ms{font-size:20px;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .thead.open .cbtn>.ms{transform:rotate(180deg)}
  .wkb{display:inline-flex;align-items:flex-end;gap:2px;height:15px}
  .wkb i{display:block;width:4px;height:2px;border-radius:2px;background:var(--line-2)}
  .wkb i.td{height:100%;background:none;border:1px dashed var(--muted)}
  .wkb i.ft{opacity:.55}
  .cbtn .idots{gap:2px}
  .cbtn .idots i{width:5px;height:5px}
  .cpanel{position:absolute;left:0;right:0;top:100%;padding:2px 16px 0;background:var(--surface);border-bottom:1px solid var(--line);border-radius:0 0 16px 16px;box-shadow:0 22px 40px rgba(0,0,0,.34);max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-user-select:text;user-select:text;visibility:hidden;opacity:0;pointer-events:none;clip-path:inset(0 0 100% 0);transition:clip-path .3s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s .3s}
  .thead.open .cpanel{visibility:visible;opacity:1;pointer-events:auto;clip-path:inset(0 -24px -70px -24px);transition:clip-path .34s cubic-bezier(.2,.8,.2,1),opacity .2s}
  .cscrim{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility 0s .25s}
  .cscrim.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s}
  .csec{padding:8px 0 6px}
  .csec+.csec{border-top:1px solid var(--line)}
  .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted);margin:2px 0 4px;font-variant-numeric:tabular-nums}
  .ch b{font-weight:500;font-size:13px;color:var(--ink-2)}
  .cint{display:flex;align-items:center;min-height:40px;margin-left:-11px;font-size:14.5px;line-height:1.3}
  .cint .pst{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted)}
  .cint>span{padding:6px 0;min-width:0}
  .cint.done{color:var(--muted)}
  .cint.done .pst{color:var(--accent)}
  .cint.partly .pst{color:var(--r2)}
  .cint.dropped{color:var(--muted)}
  .cint.dropped .pst{color:var(--r1)}
  .cint.tkd .pst .ms{animation:tick .36s}
  .cint.add>.ms{width:40px;flex:none;text-align:center;color:var(--muted);opacity:.55}
  .cin{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid transparent;border-radius:0;padding:6px 0}
  .cin::placeholder{color:var(--muted);opacity:.7}
  .cin:focus{outline:none;border-bottom-color:var(--accent)}
  .ctiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:4px}
  .ctile{display:flex;flex-direction:column;gap:1px;min-width:0;padding:7px 10px 8px;border-radius:9px;background:var(--surface-2);text-align:left}
  .ctile .k{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .ctile .k .ms{font-size:13px}
  .ctile .v{font-size:17px;font-weight:500;line-height:1.3;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ctile .v small{font-size:11.5px;font-weight:400;color:var(--muted);margin-left:4px}
  .cq{display:flex;flex-direction:column;gap:3px;width:100%;margin:2px 0 4px;padding:9px 12px 10px;border-radius:10px;background:var(--surface-2);text-align:left;font-style:italic;font-size:13.5px;line-height:1.4;color:var(--ink-2)}
  .cq small{font-style:normal;font-size:11.5px;color:var(--muted)}
  .cfoot{display:flex;align-items:center;margin:0 -6px 0 -10px}
  .cfoot .spacer{flex:1}
  .cfoot .ib{width:40px;height:40px;color:var(--muted)}
  .chandle{display:block;position:relative;width:100%;height:22px;touch-action:none}
  .chandle::after{content:"";position:absolute;left:50%;top:7px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line-2)}

  /* the day itself, as a page or in a sheet: what is planned in rows that tick, then the day's own log */
  .tday .editor{padding-top:6px}
  .editor .lab{margin:16px 0 6px}
  .editor .plab{margin-bottom:2px}
  .pbands{gap:8px}
  .pband{display:block;position:relative;padding:0;border:0;border-radius:0;background:none}
  .pbands+.pband,.pband+.pband{margin-top:8px}
  .pband .pl{display:flex;align-items:center;gap:6px;height:28px;padding:0;font-size:12px;color:var(--muted)}
  .pband .pl .ms{font-size:16px}
  .pband .pl::after{content:attr(title)}
  .pband.cur .pl{color:var(--muted)}
  .pband.now .pl{color:var(--accent)}
  .pband.now .pl::after{content:attr(title) " · now"}
  .pband .pmeta{position:absolute;top:0;right:0;height:28px;display:flex;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pband .pmeta.late{color:var(--danger)}

function reorder(list,fromId,toId,idOf){const a=list.slice();const i=a.findIndex(x=>idOf(x)===fromId),j=a.findIndex(x=>idOf(x)===toId);if(i<0||j<0||i===j)return null;const [m]=a.splice(i,1);a.splice(j,0,m);return a;}

/* ---------- plan: one list of intentions, seen per week and per day ----------
   A planned item sits on a day or floats in its week (date null), and within a day in a part
   (morning, afternoon, evening) or in none. Sport, people, events and routine chores are rows in
   `plan`; a task planned for a day counts as an item with or without a row (the row is made the
   first time the item is placed, moved or skipped). Ticking a sport or people item writes the
   usual activity or people row and links it. Placing an item is logged silently; moving it to
   another day or skipping it is logged and asks why. The week's plan as committed (planBase on
   the week's period) is the baseline: an item that is not in it was added later. */
const PARTS={m:['Morning','local_cafe'],a:['Afternoon','sunny'],e:['Evening','nightlight']};
const PKIND={task:['Task','radio_button_unchecked'],sport:['Sport','directions_run'],people:['People','groups'],event:['Event','calendar_month'],routine:['Routine','cleaning_services']};
const PADD={task:'Add a task',sport:'Plan a session: which sport?',people:'Plan time with people: who, or what?',event:'Add an event',routine:'Add a routine chore; it stays out of the reviews'};
const REASONS=['Tired','Work ran over','Weather','Something better','Overplanned','Others cancelled','Sick or injured'];
const PORD={m:0,a:1,e:2};
const planRows=()=>Object.values(S.data.plan);
const planTask=x=>x.kind==='task'&&x.ref?S.data.tasks[x.ref]||null:null;
const planSort=(a,b)=>((a.part in PORD?PORD[a.part]:3)-(b.part in PORD?PORD[b.part]:3))||String(a.time||'99').localeCompare(String(b.time||'99'))||((a.order||0)-(b.order||0))||((a.createdAt||0)-(b.createdAt||0));
function planView(x){const t=planTask(x);const st=x.status==='skipped'?'skipped':t?(tdone(t)?'done':'planned'):(x.status==='done'?'done':'planned');const title=t?t.title:(x.title||'');let icon=PKIND[x.kind]?PKIND[x.kind][1]:'flag',color='var(--muted)';if(x.kind==='sport'){icon=sportIcon(title);color=sportColor(title);}else if(x.kind==='task'){const a=t&&areaOf(t.area);if(a)color=a.color;}else if(x.kind==='routine')icon=suggestIcon(title,'cleaning_services');return Object.assign({},x,{st:st,title:title,icon:icon,color:color,task:t});}
function planIdx(){if(S.pc)return S.pc;const pc={weeks:new Map(),days:new Map(),logs:new Map(),ghosts:new Map(),by:new Map(),linked:new Set()};const push=(m,k,v)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(v);};const held=new Set();const rows=planRows();rows.forEach(x=>{if(x.kind==='task'&&x.ref)held.add(x.ref);if(x.link)pc.linked.add(x.link);});const add=x=>{const v=planView(x);pc.by.set(v.id,v);push(pc.weeks,v.week,v);if(v.date)push(pc.days,v.date,v);};rows.forEach(add);Object.values(S.data.tasks).forEach(t=>{if(t.plannedFor&&!held.has(t.id))add({id:'t:'+t.id,kind:'task',title:t.title,ref:t.id,week:weekStart(t.plannedFor),date:t.plannedFor,part:null,order:0,time:null,status:'planned',link:null,createdAt:t.createdAt||0});});Object.values(S.data.plan_log).forEach(l=>{push(pc.logs,l.planId,l);const v=pc.by.get(l.planId);if(v&&l.kind==='move'&&l.from&&l.from.date&&l.from.date!==v.date){const g=pc.ghosts.get(l.from.date)||[];if(!g.some(q=>q.v.id===v.id)){g.push({v:v,part:l.from.part||null});pc.ghosts.set(l.from.date,g);}}});pc.logs.forEach(l=>l.sort((a,b)=>(a.at||0)-(b.at||0)));pc.weeks.forEach(l=>l.sort(planSort));pc.days.forEach(l=>l.sort(planSort));S.pc=pc;return pc;}
const planDay=iso=>planIdx().days.get(iso)||[];
const planOfWeek=ws=>planIdx().weeks.get(ws)||[];
const planFloat=ws=>planOfWeek(ws).filter(x=>!x.date&&x.kind!=='routine');
const planGhosts=iso=>planIdx().ghosts.get(iso)||[];
function planBaseOf(ws){const per=S.data.periods[periodOf('week',ws).id];return per&&per.planAt&&Array.isArray(per.planBase)?per.planBase:null;}
const planInBase=(b,v)=>b.find(q=>q.id===v.id||(v.ref&&q.ref===v.ref))||null;
function planIn(v){const b=planBaseOf(v.week);return !b||!!planInBase(b,v);}
function planCommit(ws,force){if(S.readOnly)return;const p=periodOf('week',ws);const per=getPeriod(p);if(per.planAt&&!force)return;const list=planOfWeek(ws).filter(x=>x.kind!=='routine').map(x=>({id:x.id,ref:x.ref||null,date:x.date||null,part:x.part||null}));Store.put('periods',p.id,Object.assign({},per,{planBase:list,planAt:Date.now(),updatedAt:Date.now()}));}
function planReal(id){const r=S.data.plan[id];if(r)return r;if(String(id).indexOf('t:')!==0)return null;const t=S.data.tasks[id.slice(2)];if(!t)return null;const now=Date.now();const n={id:uid('pl'),kind:'task',title:t.title,ref:t.id,week:weekStart(t.plannedFor||todayISO()),date:t.plannedFor||null,part:null,order:0,time:null,status:'planned',link:null,createdAt:t.createdAt||now,updatedAt:now};Store.put('plan',n.id,n);if(S.sheet&&S.sheet.type==='plan'&&S.sheet.id===id)S.sheet.id=n.id;if(S.planOpen===id)S.planOpen=n.id;return n;}
function planSave(r,patch){const n=Object.assign({},r,patch,{updatedAt:Date.now()});Store.put('plan',n.id,n);return n;}
function planNote(r,kind,from,to){const t=todayISO(),fd=from&&from.date;const id=uid('pg');Store.put('plan_log',id,{id:id,planId:r.id,title:(planTask(r)||r).title||'',week:r.week,kind:kind,from:from||null,to:to||null,timing:!fd||fd>t?'ahead':fd===t?'day':'after',reason:'',at:Date.now()});return id;}
function planAdd(kind,title,date,ws,part){title=String(title||'').trim();if(!title||!PKIND[kind])return null;if(kind==='task'&&date&&!part)return 't:'+addTask(title,date,'');let ref=null;if(kind==='task')ref=addTask(title,date||null,'');if(kind==='sport'){const s=sports().find(x=>x.name.toLowerCase()===title.toLowerCase());if(s)title=s.name;else addSport(title,'',suggestIcon(title,''));}const id=uid('pl'),now=Date.now();Store.put('plan',id,{id:id,kind:kind,title:title,ref:ref,week:date?weekStart(date):(ws||weekStart(todayISO())),date:date||null,part:part||null,order:now,time:null,status:'planned',link:null,createdAt:now,updatedAt:now});return id;}
function planMove(id,date,part,ws){const r0=planReal(id);if(!r0)return;const from={date:r0.date||null,part:r0.part||null},to={date:date||null,part:part||null};const week=to.date?weekStart(to.date):(ws||r0.week);if(from.date===to.date&&r0.week===week){if(from.part===to.part)return;planSave(r0,{part:to.part});planNote(r0,'place',from,to);return;}if(planView(r0).st==='done')return;const was=r0.status==='skipped';planSave(r0,{date:to.date,part:to.part,week:week,status:'planned'});const t=planTask(r0);if(t&&t.plannedFor!==to.date)patchTask(t.id,{plannedFor:to.date});if(!from.date){planNote(r0,'place',from,to);return;}const lid=planNote(r0,'move',from,to);if(!was)askWhy(lid);}
function planToggle(id,ctx){const v=planIdx().by.get(id);if(!v)return;if(v.st==='skipped'){planRestore(v.id);return;}const day=v.date||ctx||todayISO();if(v.st!=='done'&&day>todayISO()){toast('That day is still ahead.');return;}if(v.task){if(tdone(v.task)){delete S.recentDone[v.task.id];setTaskStatus(v.task.id,'todo',day);}else setTaskStatus(v.task.id,'done',day);return;}const r0=S.data.plan[v.id];if(!r0)return;if(v.st==='done'){const a=r0.link&&S.data.activities[r0.link],p=r0.link&&S.data.people_log[r0.link];if(a){if(a.note&&!confirm('Remove the logged session and its note?'))return;Store.del('activities',a.id);}else if(p){if(p.people&&!confirm('Remove the logged entry with '+p.people+'?'))return;Store.del('people_log',p.id);}planSave(r0,{status:'planned',link:null});return;}let link=null;if(r0.kind==='sport')link=addActivity(day,r0.title);else if(r0.kind==='people'){link=addPeople(day);patchPeople(link,{activity:r0.title});}planSave(r0,{status:'done',link:link,date:r0.date||day});}
function planSkip(id){const r0=planReal(id);if(!r0||planView(r0).st!=='planned')return;planSave(r0,{status:'skipped'});const t=planTask(r0);if(t&&t.plannedFor)patchTask(t.id,{plannedFor:null});if(r0.kind==='routine')return;askWhy(planNote(r0,'skip',{date:r0.date||null,part:r0.part||null},null));}
function planRestore(id){const r0=S.data.plan[id];if(!r0||r0.status!=='skipped')return;planSave(r0,{status:'planned'});const t=planTask(r0);if(t&&r0.date&&!tdone(t))patchTask(t.id,{plannedFor:r0.date});if(r0.kind!=='routine')planNote(r0,'restore',null,{date:r0.date||null,part:r0.part||null});}
function planRemove(id){const r0=S.data.plan[id];if(!r0){if(String(id).indexOf('t:')===0)patchTask(id.slice(2),{plannedFor:null});return;}const t=planTask(r0);if(t&&!tdone(t)&&t.plannedFor)patchTask(t.id,{plannedFor:null});Store.del('plan',id);}
function planBefore(id,target){const b=planIdx().by.get(target);if(!b||!b.date||id===target)return;const a0=planIdx().by.get(id);if(!a0)return;if(a0.date!==b.date||(a0.part||null)!==(b.part||null)){planMove(id,b.date,b.part||null);}const a=planIdx().by.get(id)||[...planIdx().by.values()].find(x=>a0.ref&&x.ref===a0.ref);if(!a||a.date!==b.date)return;const list=planDay(b.date).filter(x=>(x.part||null)===(b.part||null)&&x.id!==a.id);const k=list.findIndex(x=>x.id===b.id);list.splice(k<0?list.length:k,0,a);list.forEach((x,i)=>{const r=planReal(x.id);if(r&&r.order!==i+1)planSave(r,{order:i+1});});}
function planUnlink(id){planRows().forEach(r=>{if(r.link===id)planSave(r,{status:'planned',link:null});});}
function setTaskDay(id,date){const t=S.data.tasks[id];if(!t)return;date=date||null;const row=planRows().find(x=>x.kind==='task'&&x.ref===id);if(!date){if(row)Store.del('plan',row.id);if(t.plannedFor)patchTask(id,{plannedFor:null});return;}if(row)planMove(row.id,date,row.date===date?row.part:null);else if(t.plannedFor&&t.plannedFor!==date)planMove('t:'+id,date,null);else if(!t.plannedFor)patchTask(id,{plannedFor:date});}
function planRoutines(iso){const have=new Set(planDay(iso).map(x=>x.title.toLowerCase()));const n=new Map();planRows().forEach(x=>{if(x.kind==='routine'&&x.title)n.set(x.title,(n.get(x.title)||0)+1);});return [...n.keys()].filter(k=>!have.has(k.toLowerCase())).sort((a,b)=>n.get(b)-n.get(a)||a.localeCompare(b)).slice(0,6);}
const pWhere=q=>q&&q.date?DAYS[dow(q.date)]+(q.part&&PARTS[q.part]?' '+PARTS[q.part][0].toLowerCase():''):'sometime this week';
function planLogText(l){const n=l.title||'Item';if(l.kind==='move')return n+' moved '+pWhere(l.from)+' → '+pWhere(l.to);if(l.kind==='skip')return n+' skipped'+(l.from&&l.from.date?' on '+DAYS[dow(l.from.date)]:'');if(l.kind==='restore')return n+' back in the plan';return n+(l.to&&l.to.date?' placed on '+pWhere(l.to):' left open for the week');}
const TIMING={ahead:'ahead of time',day:'on the day',after:'after the fact'};
let whyT=null;
function askWhy(lid){S.why=lid;clearTimeout(whyT);whyT=setTimeout(()=>{S.why=null;renderWhy();},20000);renderWhy();}
function renderWhy(){const el=document.getElementById('why');if(!el)return;const l=S.why&&S.data.plan_log[S.why];if(!l||S.readOnly){el.className='';el.innerHTML='';return;}el.className='show';el.innerHTML='<span class="wt">'+ms('flag','xs')+h(planLogText(l))+' · what got in the way?</span>'+REASONS.map(r=>'<button class="tb sm" data-action="plan-why" data-id="'+l.id+'" data-v="'+h(r)+'">'+r+'</button>').join('')+'<button class="ib" data-action="plan-why" data-id="'+l.id+'" data-v="" aria-label="Not now" title="Not now">×</button>';}
function planChip(v,o){o=o||{};const ghost=!!o.ghost,st=ghost?'ghost':v.st,inb=planIn(v),R=ro();const hist=(planIdx().logs.get(v.id)||[]).filter(l=>l.kind==='move'||l.kind==='skip').map(l=>planLogText(l)+(l.reason?' · '+l.reason:'')).join('\n');const tip=PKIND[v.kind][0]+' · '+(ghost?'moved to '+pWhere(v):st)+(inb||v.kind==='routine'?'':' · not in the plan')+(v.link&&S.data.activities[v.link]&&S.data.activities[v.link].note?'\n'+S.data.activities[v.link].note:'')+(hist?'\n'+hist:'');const icon=ghost?'subdirectory_arrow_right':st==='skipped'?'block':v.kind==='task'?(st==='done'?'check_circle':'radio_button_unchecked'):v.icon;const cls='pchip '+st+(v.kind==='routine'?' rout':'')+(o.sm?' sm':'');const label=h(v.title)+(ghost?' → '+(v.date?DAYS[dow(v.date)]:'later'):'');const extra=(v.time&&!ghost?'<small>'+h(v.time)+'</small>':'')+(!inb&&!ghost&&v.kind!=='routine'?'<i class="pun"></i>':'');if(o.fixed||ghost)return '<span class="'+cls+' fix" style="--c:'+v.color+'" title="'+h(tip)+'">'+ms(icon,st==='done'?'fill':'')+'<span class="ptt">'+label+'</span>'+extra+'</span>';return '<span class="'+cls+'" style="--c:'+v.color+'" title="'+h(tip)+'"'+(st!=='done'&&!S.readOnly?' draggable="true" data-drag="plan:'+v.id+'"':'')+(v.date&&!S.readOnly?' data-drop="before:'+v.id+'"':'')+'><button class="pst" data-action="plan-toggle" data-id="'+v.id+'" data-ctx="'+(o.date||v.date||'')+'" aria-label="'+(st==='done'?'Mark not done':st==='skipped'?'Put back in the plan':'Mark done')+'" aria-pressed="'+(st==='done')+'"'+R+'>'+ms(icon,st==='done'?'fill':'')+'</button><span class="ptt" role="button" tabindex="0" data-action="'+(o.menu?'plan-menu':'plan-open')+'" data-id="'+v.id+'"'+(o.menu?' aria-expanded="'+(S.planOpen===v.id)+'"':'')+'>'+label+'</span>'+extra+'</span>';}

function planMenuHTML(v,iso){const t=todayISO(),R=ro(),dn=v.st==='done',sk=v.st==='skipped',day=v.date||iso,b=(a,ic,l,x)=>'<button class="tb sm" data-action="'+a+'" data-id="'+v.id+'"'+(x||'')+'>'+(ic?ms(ic,'xs'):'')+l+'</button>';

function planBlockHTML(iso){const t=todayISO(),R=ro(),P=isPhone(),now=iso===t?nowPart():'',all=planDay(iso),items=all.filter(x=>x.kind!=='routine'),done=items.filter(x=>x.st==='done').length;const also=dayTasks(iso).doneHere.filter(z=>!all.some(x=>x.ref===z.id));const ghosts=planGhosts(iso);const open=p=>all.some(x=>x.part===p&&x.st==='planned');const cur=iso===t?(Object.keys(PARTS).find(open)||''):'';const chips=l=>l.map(x=>(P?planRow(x,iso):planChip(x,{date:iso,menu:true}))+(x.id===S.planOpen?planMenuHTML(x,iso):'')).join('');const can=!S.readOnly,adding=p=>can&&S.planAddAt===iso+':'+p;

  if(also.length)o+=P?'<div class="pband"><div class="pl" title="Also done"></div><div class="pc">'+also.map(z=>todoRow(z,iso,'<i class="pun"></i>')).join('')+'</div></div>':'<div class="prow"><span class="lbl">Also done</span>'+also.map(z=>'<span class="pchip done" style="--c:'+((areaOf(z.area)||{}).color||'var(--muted)')+'" title="Task · done on this day'+(z.plannedFor?', planned for '+fmtShort(z.plannedFor):', not planned')+'"><button class="pst" data-action="task-done" data-id="'+z.id+'" data-ctx="'+iso+'" aria-label="Mark not done" aria-pressed="true"'+R+'>'+ms('check_circle','fill')+'</button><span class="ptt" role="button" tabindex="0" data-action="task-open" data-id="'+z.id+'">'+h(z.title)+'</span><i class="pun"></i></span>').join('')+'</div>';

/* ---------- stats ---------- */
function periodStats(p){const dates=range(p.start,p.end);const t=todayISO();const past=dates.filter(x=>x<=t);const ratings=dates.map(x=>getDay(x).rating||0);const rated=ratings.filter(Boolean);const avg=rated.length?rated.reduce((a,b)=>a+b,0)/rated.length:null;const core=dates.filter(x=>getDay(x).core);const denom=past.length||1;const habits=Object.values(S.data.habits).filter(hb=>past.some(x=>habitActiveOn(hb,x))).sort((a,b)=>(a.order||0)-(b.order||0)).map(hb=>{const act=past.filter(x=>habitActiveOn(hb,x));const n=act.filter(x=>habitDone(x,hb.id)).length;return {hb:hb,n:n,den:act.length,pct:Math.round(100*n/(act.length||1))};});const acts=Object.values(S.data.activities).filter(a=>a.date>=p.start&&a.date<=p.end);const byType={},bySport={};acts.forEach(a=>{const s=sportByName(a.sport);const tn=(s&&s.type)||'Untyped';byType[tn]=(byType[tn]||0)+1;const sn=a.sport||'Unspecified';bySport[sn]=(bySport[sn]||0)+1;});const people=Object.values(S.data.people_log).filter(x=>x.date>=p.start&&x.date<=p.end);const peopleDays=new Set(people.map(x=>x.date)).size;const tasks=Object.values(S.data.tasks);const planned=tasks.filter(x=>x.plannedFor&&x.plannedFor>=p.start&&x.plannedFor<=p.end);const plannedDone=planned.filter(tdone);const doneIn=tasks.filter(x=>tdone(x)&&x.doneOn&&x.doneOn>=p.start&&x.doneOn<=p.end);const carried=planned.filter(x=>!tdone(x)&&x.plannedFor<t);const journaled=dates.filter(x=>dayHasContent(S.data.days[x])).length;return {dates:dates,past:past,ratings:ratings,avg:avg,core:core,habits:habits,acts:acts,byType:byType,bySport:bySport,people:people,peopleDays:peopleDays,planned:planned,plannedDone:plannedDone,doneIn:doneIn,carried:carried,journaled:journaled};}

const app=document.getElementById('app');
function render(force){if(renderGate())return;const th=settings().theme;if(th){const k=JSON.stringify(th);if(k!==S.appliedTheme){S.appliedTheme=k;applyTheme(th);}}renderNav();renderStatus();renderWhy();const ae=document.activeElement;const sheetEl=document.getElementById('sheet');if(!force&&ae&&(app.contains(ae)||sheetEl.contains(ae))&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'||ae.isContentEditable)){if(!S.rerender){S.rerender=true;ae.addEventListener('blur',()=>{if(S.rerender){S.rerender=false;render();}},{once:true});}return;}S.rerender=false;const y=window.scrollY;const sd0=document.querySelector('.side'),sh0=document.querySelector('#sheet .sheet');const sdy=sd0?sd0.scrollTop:0,shy=sh0?sh0.scrollTop:0,shk=S.sheetKey||'';hideHover();const cp0=document.getElementById('cpanel'),cpy=cp0?cp0.scrollTop:0;app.innerHTML=demoBanner()+(VIEWS[viewNow()]||VIEWS.calendar)();renderSheet();renderQuick();drafts();document.querySelectorAll('textarea.ta').forEach(autosize);applyFocus();positionScroll();S.sheetKey=S.sheet?S.sheet.type+':'+(S.sheet.id||S.sheet.name||''):'';const sd1=document.querySelector('.side');if(sd1&&sdy)sd1.scrollTop=sdy;const sh1=document.querySelector('#sheet .sheet');if(sh1&&shy&&shk===S.sheetKey)sh1.scrollTop=shy;window.scrollTo(0,y);const cp1=document.getElementById('cpanel');if(cp1&&cpy)cp1.scrollTop=cpy;typingSync();openAtNow();}
function positionScroll(){const cs=document.getElementById('calscroll');if(cs){const b=cs.querySelector('.mblock[data-month="'+S.cursor.slice(0,7)+'"]');if(b){S.scrollLock=true;cs.scrollTop=b.offsetTop-cs.offsetTop;setTimeout(()=>{S.scrollLock=false;},80);}}const wsEl=document.getElementById('weekscroll');if(wsEl){const b=wsEl.querySelector('.wblock[data-week="'+weekStart(S.cursor)+'"]');if(b){S.scrollLock=true;wsEl.scrollLeft=b.offsetLeft-wsEl.offsetLeft;setTimeout(()=>{S.scrollLock=false;},80);}}calFit();}
function calTitleHTML(){const d=fromISO(S.cursor);return (S.calMode==='month'?MONTHS[d.getMonth()]+' <span>'+d.getFullYear()+'</span>':pTitle(periodOf('week',S.cursor)))+ms(S.calMode==='month'?'view_week':'calendar_month','swap');}
const calOnToday=()=>S.calMode==='month'?S.cursor.slice(0,7)===todayISO().slice(0,7):weekStart(S.cursor)===weekStart(todayISO());
function updateCalTitle(){const el=document.querySelector('.cal-title');if(!el)return;el.innerHTML=calTitleHTML();const td=document.querySelector('[data-action="cal-today"]');if(td)td.hidden=calOnToday();const pop=document.querySelector('.chipw .pop-people');if(pop)pop.outerHTML=popHTML('people').replace('class="pop"','class="pop pop-people"');}
let scrollT;function onCalScroll(e){if(S.scrollLock)return;clearTimeout(scrollT);scrollT=setTimeout(()=>{const cs=e.target;const month=cs.id==='calscroll';const blocks=[...cs.querySelectorAll(month?'.mblock':'.wblock')];if(!blocks.length)return;let best=null,bd=1e9;blocks.forEach(b=>{const d=Math.abs(month?(b.offsetTop-cs.offsetTop-cs.scrollTop):(b.offsetLeft-cs.offsetLeft-cs.scrollLeft));if(d<bd){bd=d;best=b;}});if(!best)return;const key=month?best.dataset.month:best.dataset.week;const cur=month?S.cursor.slice(0,7):weekStart(S.cursor);if(key===cur)return;S.cursor=month?key+'-01':key;const i=blocks.indexOf(best);if(i===0||i===blocks.length-1)render(true);else updateCalTitle();},120);}
function autosize(t){t.style.height='auto';t.style.height=Math.max(36,t.scrollHeight+2)+'px';}
function renderNav(){const g=document.getElementById('gear');if(g)g.classList.toggle('on',S.view==='settings');document.getElementById('nav').innerHTML=Object.keys(VIEW_NAMES).filter(v=>v!=='settings').map(v=>'<button data-nav="'+v+'" class="'+(viewNow()===v?'on':'')+'">'+VIEW_NAMES[v]+'</button>').join('');renderTabs();}
function renderStatus(){const el=document.getElementById('status');let cls='',txt='';if(Store.mode==='demo'){cls='warn';txt='Example data';}else if(S.status==='loading'){txt='Loading';}else if(S.status==='slow'){cls='warn';txt='Can’t reach your data yet';}else if(S.status==='error'){cls='warn';txt='Data unavailable';}else if(S.readOnly){cls='warn';txt='View only';}else if(Store.pending.size){cls='busy';txt='Saving';}else{cls='ok';txt='Saved';}el.className='status '+cls;el.title=txt;el.innerHTML='<i></i><span>'+txt+'</span>';S.st=[Store.mode==='demo'?'demo':cls,txt];const sd=document.querySelector('.sdot');if(sd){sd.className='sdot '+S.st[0];sd.title=txt;}}

function ringHTML(d,lg){const r=d.rating||0;const C=2*Math.PI*7.5;const off=C*(1-r/5);return '<span class="ringw'+(d.core?' core':'')+(lg?' lg':'')+'" title="'+(d.core?'Core memory'+(r?' · rated '+r:''):(r?'Rated '+r:''))+'" style="--rc:var(--r'+(r||3)+')"><svg class="ring" viewBox="0 0 20 20" aria-hidden="true"><circle class="bg" cx="10" cy="10" r="7.5"/><circle class="fg" cx="10" cy="10" r="7.5" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+(d.core&&!r?0:off).toFixed(2)+'"/></svg>'+(d.core?ms('auto_awesome','fill'):'')+'</span>';}
